blueprint:
  name: "[mosart] Hue Dimmer Switch (RWL022) via ZHA"
  description: >-
    Controller for the Philips Hue Dimmer Switch (RWL022, 4 physical
    buttons, top to bottom: On/Off toggle, brightness up, brightness
    down, Scene) on ZHA.


    - **On/Off (top button)**: toggles — turns the lights off if they're
    on, first snapshotting their exact state (brightness/color steps
    from the Brightness buttons included) into a scratch scene; turns
    them on restoring that exact snapshot if they're off. Before the
    first Off has ever run (no snapshot exists yet), On instead restores
    the last preset this switch applied, or the first scene below the
    very first time.

    - **Scene (bottom button, printed with the Hue logo rather than an
    off icon on this model)**: applies the *next* scene in the list,
    cycling through them on repeated presses — the same way the Hue
    bridge cycles a room's scenes. Works from off too, which turns the
    lights on.

    - **Brightness up / brightness down**: steps the current brightness,
    independent of which scene is showing. A click steps once; holding
    steps repeatedly for as long as the button stays held.


    This device has no event entities under ZHA, so (per this repo's
    convention for ZHA remotes) the triggers key off `device_id` with
    `zha_event`, not an `event.*` entity.

    Unlike the plain On/Off/Step Zigbee cluster commands the Hue Dimmer
    Switch v1 (RWL021) and other ZHA remotes report, this model's quirk
    synthesizes named per-button events — `on_short_release`,
    `up_short_release`, `up_hold` (repeats while held),
    `up_long_release`, and the equivalents for `down`/`off` — the same
    scheme `[mosart] Hue Smart Button (ROM001) via ZHA` uses. Each is
    matched by its own trigger `id`, with no template needed to tell the
    buttons apart. The device also still emits raw LevelControl
    `step`/`stop` cluster commands alongside these, left over from
    whatever group/scene bindings the Hue bridge set up before it was
    moved to ZHA; those are not used here — direction in a raw `step`
    event's `args[0]` is a `StepMode` enum (`0`/`1`), not the
    `"up"`/`"down"` string it might look like, and the named per-button
    events above already cover click and hold cleanly.


    Every scene applied (by the Scene button cycling, or the On/Off
    button restoring one) is recorded in an `input_text` helper — named
    after the **Room** input, the same way the `[mosart] Presence
    lighting with scene memory`, `[mosart] Hue Tap Dial Switch (RDM002)
    via ZHA` and `[mosart] Hue Smart Button (ROM001) via ZHA` blueprints
    derive their own name for it — so a presence automation can restore
    the room's last chosen scene instead of forcing a fixed one. The
    helper doesn't need to exist: without one, both buttons just always
    start from the first scene below.


    Requires the `scene_presets` custom integration
    (Hypfer/hass-scene_presets).
  source_url: https://github.com/mosart/home-assistant-blueprints/blob/main/controllers/hue_dimmer_switch_rwl022/hue_dimmer_switch_rwl022.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    remote:
      name: Switch
      description: The Hue Dimmer Switch this automation responds to.
      selector:
        device:
          filter:
            - integration: zha
              model: RWL022
    lights:
      name: Lights
      description: The lights to control. Pick an area or individual lights.
      selector:
        target:
          entity:
            - domain: light
    reference_light:
      name: Reference entity
      description: >-
        Entity used to determine whether the lights are on or off.
        Preferably a light group covering all the lights selected above.
      selector:
        entity:
          domain: light
    room:
      name: Room
      description: >-
        The area(s) this switch lives in. Used only to derive the "last
        chosen scene" helper's entity ID (`input_text.<room>_laatste_preset`)
        — every scene applied through this switch is written there, so a
        presence automation can restore what was picked instead of
        forcing one fixed scene.

        Pick the same area(s), in the same order, as the matching
        Presence lighting instance's **Rooms** input — both blueprints
        derive the identical helper name from this, so nothing needs
        wiring by hand. That helper isn't created automatically; make an
        `input_text` named to match once (Settings → Devices & services →
        Helpers), or leave this pointed at an area with no matching
        helper to skip the feature entirely — a missing helper is
        silently treated as "nothing remembered yet."
      selector:
        area:
          multiple: true
    scene_1:
      name: Scene 1
      description: First scene in the Scene-button cycle.
      selector: &preset_selector
        select:
          mode: dropdown
          options:
