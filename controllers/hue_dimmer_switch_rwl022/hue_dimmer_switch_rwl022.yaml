      selector: *preset_selector
    scene_4:
      name: Scene 4
      description: Fourth scene in the Scene-button cycle.
      selector: *preset_selector
    scene_5:
      name: Scene 5
      description: Fifth scene in the Scene-button cycle.
      selector: *preset_selector
    dim_step:
      name: Dim step
      description: How much the brightness changes per step while holding up/down.
      default: 10
      selector:
        number:
          min: 1
          max: 25
          unit_of_measurement: "%"
          mode: slider
          step: 1
    transition:
      name: Transition time
      description: How smoothly each dim step and scene change is applied.
      default: 0.3
      selector:
        number:
          min: 0
          max: 2
          unit_of_measurement: seconds
          mode: box
          step: 0.1

# restart: a fresh press must supersede whatever is still mid-flight (e.g.
# a dim step waiting on a slow Zigbee round-trip) rather than queue behind
# it -- same reasoning as hue_smart_button_rom001.yaml's mode.
mode: restart

variables:
  room: !input room
  room_list: "{{ [room] if room is string else room }}"
  last_preset_helper: "input_text.{{ room_list | join('_') }}_laatste_preset"
  dim_step: !input dim_step
  remote: !input remote
  lights: !input lights
  # Resolves the lights target (area/device/entity) to a concrete list of
  # light entity IDs, for scene.create's snapshot_entities -- that action
  # takes an explicit entity list, not a target.
  light_entities: >-
    {% set t = lights %}
    {% set ents = namespace(value=[]) %}
    {% if t.entity_id is defined %}
      {% set ents.value = ents.value + ([t.entity_id] if t.entity_id is string else t.entity_id) %}
    {% endif %}
    {% if t.area_id is defined %}
      {% for a in ([t.area_id] if t.area_id is string else t.area_id) %}
        {% set ents.value = ents.value + (area_entities(a) | select('match', '^light\\.') | list) %}
      {% endfor %}
    {% endif %}
    {% if t.device_id is defined %}
      {% for d in ([t.device_id] if t.device_id is string else t.device_id) %}
        {% set ents.value = ents.value + (device_entities(d) | select('match', '^light\\.') | list) %}
      {% endfor %}
    {% endif %}
    {{ ents.value | unique | list }}
  # A snapshot of the lights' exact state (brightness/color, including
  # anything changed with the brighten/dim buttons since the last named
  # scene) is taken into this scene right before Off, and restored from
  # it on On -- so toggling off and back on doesn't snap back to the
  # named scene's own fixed brightness. See the "scenes" reference's
  # scene.create/snapshot_entities pattern.
  snapshot_scene_id: "rwl022_{{ remote }}_snapshot"
  snapshot_scene_entity: "scene.{{ snapshot_scene_id }}"
  has_snapshot: "{{ states(snapshot_scene_entity) not in ['unknown', 'unavailable'] }}"
  scene_1: !input scene_1
  scene_2: !input scene_2
  scene_3: !input scene_3
  scene_4: !input scene_4
  scene_5: !input scene_5
  # Fixed cycle order for the Scene button. Index lookups below use this
  # list as-is, so reordering the scene_N inputs reorders the cycle.
  # Must come after scene_1..scene_5 above -- variables are rendered in
  # order, so referencing them here before they're defined silently
  # produces a list of Undefined values instead of an error.
  scenes: "{{ [scene_1, scene_2, scene_3, scene_4, scene_5] }}"
  current_preset: "{{ states(last_preset_helper) }}"
  # -1 (not found) wraps to index 0 on the next line, so "nothing
  # remembered yet" and "remembered preset isn't in this cycle" both
  # correctly start the cycle from scene_1.
  current_index: "{{ scenes.index(current_preset) if current_preset in scenes else -1 }}"
  next_preset: "{{ scenes[(current_index + 1) % (scenes | length)] }}"
  # Resuming from off restores the remembered preset if it's still part
  # of this cycle, else falls back to scene_1 -- never advances the
  # cycle, so a plain on/off/on doesn't skip a scene.
  resume_preset: "{{ current_preset if current_preset in scenes else scene_1 }}"

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: on_short_release
    id: toggle
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: off_short_release
    id: cycle
  # A click (short_release) and a hold (hold, which repeats for as long
  # as the button stays down) both step the brightness once -- hold's
  # own repeat rate gives continuous dimming for free, so neither needs
  # a repeat/wait loop here.
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: up_short_release
    id: brighten
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: up_hold
    id: brighten
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: down_short_release
    id: dim
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: down_hold
    id: dim

conditions: []

actions:
  - choose:
      # On/Off (top button): toggle
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - if:
              - condition: state
                entity_id: !input reference_light
                state: "on"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ snapshot_scene_id }}"
                  snapshot_entities: "{{ light_entities }}"
              - action: light.turn_off
                target: !input lights
                data:
                  transition: !input transition
            else:
              - if:
                  - condition: template
                    value_template: "{{ has_snapshot }}"
                then:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ snapshot_scene_entity }}"
                    data:
                      transition: !input transition
                else:
                  - action: scene_presets.apply_preset
                    data:
                      preset_id: "{{ resume_preset }}"
                      targets: !input lights
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ last_preset_helper }}"
                    data:
                      value: "{{ resume_preset }}"

      # Scene (bottom button): always cycle to the next scene, turning
      # the lights on from off if needed
      - conditions:
          - condition: trigger
            id: cycle
        sequence:
          - if:
              - condition: state
                entity_id: !input reference_light
                state: "on"
            then:
              - action: scene_presets.apply_preset
                data:
                  preset_id: "{{ next_preset }}"
                  targets: !input lights
              - action: input_text.set_value
                target:
                  entity_id: "{{ last_preset_helper }}"
                data:
                  value: "{{ next_preset }}"
            else:
              - action: scene_presets.apply_preset
                data:
                  preset_id: "{{ resume_preset }}"
                  targets: !input lights
              - action: input_text.set_value
                target:
                  entity_id: "{{ last_preset_helper }}"
                data:
                  value: "{{ resume_preset }}"

      # Brighten: one step up, on click or on each hold repeat
      - conditions:
          - condition: trigger
            id: brighten
        sequence:
          - action: light.turn_on
            target: !input lights
            data:
              brightness_step_pct: "{{ dim_step | int }}"
              transition: !input transition

      # Dim: one step down, on click or on each hold repeat
      - conditions:
          - condition: trigger
            id: dim
        sequence:
          - action: light.turn_on
            target: !input lights
            data:
              brightness_step_pct: "{{ -(dim_step | int) }}"
              transition: !input transition
