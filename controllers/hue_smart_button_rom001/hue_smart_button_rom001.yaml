    preset_double:
      name: Preset for double press
      description: Same preset list as above.
      selector: *preset_selector
    dim_step:
      name: Dim step
      description: How much the brightness changes per step while holding.
      default: 5
      selector:
        number:
          min: 1
          max: 25
          unit_of_measurement: "%"
          mode: slider
          step: 1
    transition:
      name: Transition time
      description: How smoothly each dim step is applied.
      default: 0.3
      selector:
        number:
          min: 0
          max: 2
          unit_of_measurement: seconds
          mode: box
          step: 0.1

mode: queued
max: 25
max_exceeded: silent

variables:
  step_size: !input dim_step

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button
      command: on_short_release
    id: short
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button
      command: on_double_press
    id: double
  # The button repeats this command while held and stops on release
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button
      command: step
    id: dim
  # Fires exactly once per hold, so it is the reliable moment to flip direction
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button
      command: on_long_release
    id: released

conditions: []

actions:
  - choose:
      # Short press: toggle between off and the chosen preset
      - conditions:
          - condition: trigger
            id: short
        sequence:
          - if:
              - condition: state
                entity_id: !input reference_light
                state: "on"
            then:
              - action: light.turn_off
                target: !input lights
            else:
              - action: scene_presets.apply_preset
                data:
                  preset_id: !input preset_short
                  targets: !input lights

      # Double press: second preset
      - conditions:
          - condition: trigger
            id: double
        sequence:
          - action: scene_presets.apply_preset
            data:
              preset_id: !input preset_double
              targets: !input lights

      # Hold: one dim step per step event
      - conditions:
          - condition: trigger
            id: dim
        sequence:
          # If the lights are off, always start by brightening
          - if:
              - condition: state
                entity_id: !input reference_light
                state: "off"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: !input direction_helper
          - if:
              - condition: state
                entity_id: !input direction_helper
                state: "off"
            then:
              - action: light.turn_on
                target: !input lights
                data:
                  brightness_step_pct: "{{ -step_size | int }}"
                  transition: !input transition
            else:
              - action: light.turn_on
                target: !input lights
                data:
                  brightness_step_pct: "{{ step_size | int }}"
                  transition: !input transition

      # Released: reverse the direction for the next hold
      - conditions:
          - condition: trigger
            id: released
        sequence:
          - action: input_boolean.toggle
            target:
              entity_id: !input direction_helper
