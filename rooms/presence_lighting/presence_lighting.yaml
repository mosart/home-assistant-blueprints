blueprint:
  name: "[mosart] Presence lighting with scene memory"
  description: >-
    Presence lighting for one room, written to defer to the scene already in
    use instead of overriding it.


    - **Motion while the room is dark**: each time slot (Daytime, Evening,
    Night) has its own **preset on motion** setting — which preset to
    apply: the time slot preset below; the last **button preset**, i.e. the
    last preset a paired remote applied; or the **last light settings**, a
    snapshot of whatever the lights were already doing, colour and all,
    independent of any preset — plus its own **brightness behaviour**
    toggle, "Always use this slot's brightness" (default) or "Use preset's
    own brightness". Button preset and last-light-settings are two
    deliberately separate memories: a button preset is a preset identity —
    read from `input_text.<room>_laatste_preset`, the same helper name the
    `[mosart] Hue Tap Dial Switch (RDM002) via ZHA` and `[mosart] Hue Smart
    Button (ROM001) via ZHA` blueprints derive from their own **Room**
    input, so nothing needs wiring by hand — while last-light-settings is a
    raw attribute snapshot taken the moment the room last went quiet, before
    any dimming; it also catches a manual colour-picker tweak a preset was
    never told about, and it is never the dimmed or switched-off state.
    Either falls back to the time slot preset once there's nothing to
    restore (no button preset chosen yet, or no snapshot taken yet — a room
    with no remote simply never has a button preset to fall back on). Each
    preset's time boundary sits next to it below — morning and evening can
    each use a fixed clock time or the sun's actual sunrise/sunset.

    - **Motion while already lit**: normally does nothing — a preset someone
    just set by hand (remote, dashboard, voice assistant) is left alone.
    Exception: a slot whose **preset on motion** is "Last light settings"
    combined with "Always use this slot's brightness" still pins the
    brightness, without touching what's showing — so a scene picked earlier
    in the evening still dims for the night instead of staying at whatever
    brightness it was set to. Every other combination — including "Last
    light settings" at its own brightness — leaves an already-lit room
    alone; only that one combination touches it.

    - **Motion while dimmed**: puts back exactly what was on before the dim.

    - **No motion**: dims as a warning, then switches off.

    - **A new day begins**: the button preset memory is forgotten, so the
    first motion of the day falls through to the time-of-day preset (or a
    keep-current slot's own snapshot, which a new day leaves alone — see
    "Apply Daytime preset immediately each morning" below) rather than
    replaying whatever was picked by remote the day before.


    The "Always apply time-of-day preset on motion" toggle (off by default)
    replaces all of the above with something simpler and more predictable:
    every motion event applies the Daytime/Evening/Night preset for whatever
    slot it currently is (still following that slot's own brightness
    choice — its own, or forced to the slot's brightness input), full stop
    — regardless of whether the light is already on, what it's currently
    showing, or why. Turn this on for a room where the light can end up in
    a state this blueprint never set (e.g. a smart bulb wired behind a
    physical wall switch, which powers back up at its own default
    brightness whenever the switch cuts and restores power) and a
    remembered state would be wrong more often than it would be right.


    Media actively playing in the room postpones dimming and switching off,
    and starting to play cancels a dim or switch-off already in progress —
    the same as returning motion does, since both share the same trigger.
    A paused player doesn't postpone anything — pausing something and
    leaving the room still dims and switches off on schedule.


    Pick one or more areas and it takes both the motion/occupancy sensors and
    the lights from them; an optional override lets you depart from that.
    Reacts to either class of sensor a room has — useful when a device's
    motion and occupancy entities behave differently (e.g. one is stuck or
    unreliable) or when different rooms use different sensor types.


    Requires the `scene_presets` custom integration
    (Hypfer/hass-scene_presets) and one `input_boolean` per instance — see
    the README.
  source_url: https://github.com/mosart/home-assistant-blueprints/blob/main/rooms/presence_lighting/presence_lighting.yaml
  domain: automation
  homeassistant:
    min_version: 2026.7.0
  input:
    where:
      name: Where
      icon: mdi:home-search
      input:
        room:
          name: Rooms
          description: >-
            The areas this automation covers. Their motion and occupancy sensors
            drive it (either fires the same behaviour — see the blueprint
            description), their lights are what it controls, and media players in
            them postpone dimming and switching off. Pick more than one to treat
            adjoining spaces as a single room.


            This field can't preview which sensors and lights that resolves to —
            Home Assistant's blueprint editor has no way to show computed results
            from another field. To check before saving: Settings → Areas → open
            the area — its entity list is the same one this automation reads,
            live. Light *groups* shown there are excluded automatically (see
            "Lights" below); everything else listed is included.
          selector:
            area:
              multiple: true
        lights:
          name: Lights (override)
          description: >-
            Leave empty to control every light in the areas above — that is the
            normal case, and it follows the areas as you move devices between
            them. Set it only to depart from that: to control a subset, or to
            reach a light that lives in another area.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        dim_flag:
          name: Dimming flag helper
          description: >-
            An `input_boolean` this automation uses to remember that it was the
            one that dimmed the lights, so returning motion knows to put them
            back. Needs its own helper per room — do not share one between rooms.
          selector:
            entity:
              filter:
                - domain: input_boolean
        force_preset_on_motion:
          name: Always apply time-of-day preset on motion
          description: >-
            Off by default: motion follows the behaviour described above (put
            back the snapshot from before a dim, then whichever preset this
            slot's "preset on motion" setting calls for) — and does nothing
            at all if the light already appears to be on, unless that setting
            is "Last light settings" combined with "Always use this slot's
            brightness".

            Turn this on to skip all of that. Every motion event then applies
            the Daytime/Evening/Night preset below for whatever slot it
            currently is, unconditionally — including when the light is
            already on, and ignoring any button preset or kept light
            settings — still forcing its brightness input too unless this
            slot's **brightness behaviour** is "Use preset's own brightness"
            (that option behaves the same here as it always does; there is
            no existing state left to keep, so even a "Last light settings"
            source forces the brightness here exactly like the other two
            sources do). Use this for a room where the light can be switched
            or power-cycled outside Home Assistant's control (a physical
            wall switch on a smart bulb's power is the common case: the
            bulb comes back at its own default brightness, which this
            blueprint would otherwise mistake for an intentional state and
            leave alone).
          default: false
          selector:
            boolean: {}
    daytime:
      name: Daytime
      icon: mdi:weather-sunny
      input:
        preset_day:
          name: Daytime preset
          description: Applied when the room is dark and nothing is remembered.
          selector: &preset_selector
            select:
              mode: dropdown
