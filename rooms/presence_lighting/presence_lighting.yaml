blueprint:
  name: "[mosart] Presence lighting with scene memory"
  description: >-
    Motion and presence lighting for one room, with three time slots (Daytime,
    Evening, Night). Each slot sets **when** it begins, **what** light it shows
    (a scene preset, a colour, a white temperature, or off) and **how** motion
    and the slot's start treat the room. Lights someone changed by hand are
    left alone until the next slot; a quiet room dims as a warning, then
    switches off; playing media keeps the lights on.


    Requires the `scene_presets` custom integration (Hypfer/hass-scene_presets)
    and one `input_boolean` per room. Full explanation of every setting:
    [README](https://github.com/mosart/home-assistant-blueprints#presence-lighting-with-scene-memory).
  source_url: https://github.com/mosart/home-assistant-blueprints/blob/main/rooms/presence_lighting/presence_lighting.yaml
  domain: automation
  homeassistant:
    min_version: 2026.7.0
  input:
    where:
      name: Room
      icon: mdi:home-search
      description: >-
        Which areas this covers and which lights it controls. Details:
        [README → What it controls](https://github.com/mosart/home-assistant-blueprints#what-it-controls).
      input:
        room:
          name: Rooms
          description: >-
            Their motion/occupancy sensors, lights and media players drive this
            automation. Pick several to treat adjoining spaces as one room.
          selector:
            area:
              multiple: true
        lights:
          name: Lights (override)
          description: Leave empty to control every light in the rooms above.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        lights_exclude:
          name: Lights to exclude
          description: >-
            Lights in the rooms to leave alone (e.g. a tablet screen). Ignored
            when the override above is set.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        dim_flag:
          name: Dimming flag helper
          description: >-
            An input_boolean of its own for this room; remembers that this
            automation did the dimming.
          selector:
            entity:
              filter:
                - domain: input_boolean
    daytime:
      name: Daytime
      icon: mdi:weather-sunny
      collapsed: true
      description: >-
        From morning until the evening begins. Details:
        [README → The three time slots](https://github.com/mosart/home-assistant-blueprints#the-three-time-slots).
      input:
        day_start_use_sunrise:
          name: When · Start at sunrise
          description: Off — start at the fixed time below.
          default: false
          selector:
            boolean: {}
        day_start:
          name: When · Fixed start time
          description: Also the end of the night.
          default: "07:00:00"
          selector:
            time:
        preset_day:
          name: What · Light
          description: A scene preset, a colour or white (pick below), or off.
          selector: &preset_selector
            select:
              mode: dropdown
              options:
                - label: "No preset — turn off"
                  value: "off"
                - label: "Light colour (pick below)"
                  value: "color"
                - label: "White (pick temperature below)"
                  value: "white"
