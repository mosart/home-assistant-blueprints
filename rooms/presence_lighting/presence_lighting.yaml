        day_light_colour:
          name: What · Colour
          description: Only for "Light colour (pick below)".
          default: [255, 110, 84]
          selector: &colour_rgb_selector
            color_rgb: {}
        day_white_kelvin:
          name: What · White temperature
          description: Only for "White (pick temperature below)".
          default: 2700
          selector: &kelvin_selector
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        day_own_brightness:
          name: What · Keep the preset's own brightness
          description: >-
            Off — use the brightness below. A colour or white always uses the
            brightness below.
          default: false
          selector: &own_brightness_selector
            boolean: {}
        day_brightness_pct:
          name: What · Brightness
          default: 100
          selector: &brightness_pct_selector
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 1
        day_preset_source:
          name: How · On motion in a dark room
          description: >-
            The light above, the last preset a remote picked, or exactly how
            the lights were before the room went quiet.
          default: time_slot
          selector: &preset_source_selector
            select:
              mode: dropdown
              options:
                - label: "This slot's light"
                  value: time_slot
                - label: "Last remote preset (else this slot's light)"
                  value: button
                - label: "Last light settings (else this slot's light)"
                  value: last
        day_at_start:
          name: How · When the slot begins
          description: >-
            Lights that are still on can ease over to this slot. Lights that
            are off stay off until there is motion.
          default: wait
          selector: &at_start_selector
            select:
              mode: dropdown
              options:
                - label: "Wait for motion"
                  value: wait
                - label: "Ease lit lights over (time below)"
                  value: ease
        day_start_transition:
          name: How · Slot-start transition
          description: Only for "Ease lit lights over".
          default: 120
          selector: &start_transition_selector
            number:
              min: 0
              max: 300
              unit_of_measurement: seconds
              mode: slider
              step: 5
    evening:
      name: Evening
      icon: mdi:weather-sunset
      collapsed: true
      description: >-
        From the evening start until the night begins. Same fields as Daytime.
      input:
        evening_start_use_sunset:
          name: When · Start at sunset
          description: Off — start at the fixed time below.
          default: true
          selector:
            boolean: {}
        evening_start:
          name: When · Fixed start time
          default: "18:00:00"
          selector:
            time:
        preset_evening:
          name: What · Light
          selector: *preset_selector
        evening_light_colour:
          name: What · Colour
          description: Only for "Light colour (pick below)".
          default: [255, 110, 84]
          selector: *colour_rgb_selector
        evening_white_kelvin:
          name: What · White temperature
          description: Only for "White (pick temperature below)".
          default: 2700
          selector: *kelvin_selector
        evening_own_brightness:
          name: What · Keep the preset's own brightness
          description: Off — use the brightness below.
          default: false
          selector: *own_brightness_selector
        evening_brightness_pct:
          name: What · Brightness
          default: 50
          selector: *brightness_pct_selector
        evening_preset_source:
          name: How · On motion in a dark room
          default: last
          selector: *preset_source_selector
        evening_at_start:
          name: How · When the slot begins
          default: wait
          selector: *at_start_selector
        evening_start_transition:
          name: How · Slot-start transition
          description: Only for "Ease lit lights over".
          default: 120
          selector: *start_transition_selector
    night:
      name: Night
      icon: mdi:weather-night
      collapsed: true
      description: >-
        From the night start until the morning (Daytime) begins. Same fields
        as Daytime.
      input:
        night_start:
          name: When · Start time
          default: "23:00:00"
          selector:
            time:
        preset_night:
          name: What · Light
          selector: *preset_selector
        night_light_colour:
          name: What · Colour
          description: Only for "Light colour (pick below)".
          default: [255, 110, 84]
          selector: *colour_rgb_selector
        night_white_kelvin:
          name: What · White temperature
          description: Only for "White (pick temperature below)".
          default: 2700
          selector: *kelvin_selector
        night_own_brightness:
          name: What · Keep the preset's own brightness
          description: Off — use the brightness below.
          default: false
          selector: *own_brightness_selector
        night_brightness_pct:
          name: What · Brightness
          default: 3
          selector: *brightness_pct_selector
        night_preset_source:
          name: How · On motion in a dark room
          default: last
          selector: *preset_source_selector
        night_at_start:
          name: How · When the slot begins
          default: wait
          selector: *at_start_selector
        night_start_transition:
          name: How · Slot-start transition
          description: Only for "Ease lit lights over".
          default: 120
          selector: *start_transition_selector
    dim_behaviour:
      name: Dim & switch-off
      icon: mdi:brightness-4
      collapsed: true
      description: >-
        What happens when nobody moves. Details:
        [README → Missed switch-offs](https://github.com/mosart/home-assistant-blueprints#missed-switch-offs).
      input:
        no_motion_dim_after:
          name: Dim after
          description: No motion for this long.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
        dim_brightness_pct:
          name: Dim by
          description: Relative to the current brightness, so it never brightens.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 1
        no_motion_off_after:
          name: Switch off after
          description: How long the dim lasts before the lights go out.
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration:
    transitions:
      name: Transitions
      icon: mdi:transition
      collapsed: true
      description: >-
        How fast lights change. Details:
        [README → Transitions](https://github.com/mosart/home-assistant-blueprints#transitions).
      input:
        fade_in_seconds:
          name: Fade-in from dark
          description: Motion in a dark (or warning-dimmed) room.
          default: 3
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
              mode: slider
              step: 1
        lit_transition:
          name: Transition when already lit
          description: >-
            Motion adjusting lights that are already on. Not restarted by
            further motion.
          default: 5
          selector:
            number:
              min: 0
              max: 5
              unit_of_measurement: minutes
              mode: slider
              step: 1
        transition:
          name: Fade-out (from dim) to dark
          description: The warning dim, the switch-off, and a slot set to off.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
              mode: slider
              step: 1
    media:
      name: Media
      icon: mdi:television-play
      collapsed: true
      description: >-
        Media playing in the rooms keeps the lights on. Details:
        [README](https://github.com/mosart/home-assistant-blueprints#presence-lighting-with-scene-memory).
      input:
        media_players_on:
          name: Players that count while on
          description: >-
            For players that report "paused"/"idle" while in use (e.g. a
            Chromecast): on at all = room in use.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        media_hold_limit:
          name: Longest hold for those players
          description: After this long without motion the room dims anyway.
          default:
            hours: 2
            minutes: 0
            seconds: 0
          selector:
            duration:
        media_players_ignore:
          name: Players to ignore
          description: >-
            Their "playing" never keeps the lights on (e.g. a duplicate entity
            of the same device).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
    advanced:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        recovery_sensors:
          name: Sensors that can drop offline
          description: >-
            A sensor coming back from unavailable straight to detected then
            counts as motion.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        force_preset_on_motion:
          name: Always apply the slot's light on motion
          description: >-
            Ignore memory: every motion applies the current slot's light, also
            when already on (lights changed by hand this slot excepted). For a
            bulb behind a wall switch.
          default: false
          selector:
            boolean: {}

# restart: returning motion during the dim window must pre-empt the pending
# switch-off, and a fresh no-motion cycle must supersede the previous one.
mode: restart
max_exceeded: silent

variables:
  room: !input room
  lights: !input lights
  lights_exclude: !input lights_exclude
  force_preset_on_motion: !input force_preset_on_motion
  # Exposed as plain variables (rather than only inline `!input` at each
  # call site) so the action `data:` blocks below can build their whole
  # service-call dict in one Jinja expression — see the brightness
  # comment further down for why that's necessary instead of `omit`.
  preset_night: !input preset_night
  preset_evening: !input preset_evening
  preset_day: !input preset_day
  # "Light colour (pick below)" / "White (pick temperature below)" in a
  # preset dropdown are not scene presets: they turn the lights on with
  # light.turn_on in the slot's picked colour or white temperature. Decoded
  # here into light.turn_on data; empty when the slot holds a real scene
  # preset (or "off").
  day_light_colour: !input day_light_colour
  day_white_kelvin: !input day_white_kelvin
  day_colour_data: >-
    {%- if preset_day == 'color' -%}{{ {'rgb_color': day_light_colour | map('int') | list} }}
    {%- elif preset_day == 'white' -%}{{ {'color_temp_kelvin': day_white_kelvin | int} }}
    {%- else -%}{{ {} }}
    {%- endif -%}
  evening_light_colour: !input evening_light_colour
  evening_white_kelvin: !input evening_white_kelvin
  evening_colour_data: >-
    {%- if preset_evening == 'color' -%}{{ {'rgb_color': evening_light_colour | map('int') | list} }}
    {%- elif preset_evening == 'white' -%}{{ {'color_temp_kelvin': evening_white_kelvin | int} }}
    {%- else -%}{{ {} }}
    {%- endif -%}
  night_light_colour: !input night_light_colour
  night_white_kelvin: !input night_white_kelvin
  night_colour_data: >-
    {%- if preset_night == 'color' -%}{{ {'rgb_color': night_light_colour | map('int') | list} }}
    {%- elif preset_night == 'white' -%}{{ {'color_temp_kelvin': night_white_kelvin | int} }}
    {%- else -%}{{ {} }}
    {%- endif -%}
  day_brightness_pct: !input day_brightness_pct
  day_preset_source: !input day_preset_source
  day_own_brightness: !input day_own_brightness
  # Internal mode string the actions below branch on — kept as-is so that
  # logic only has to understand one string per slot instead of combining
  # a preset-source select with a brightness toggle at every check. See the
  # Daytime preset's two inputs above for what each half of the name means.
  day_brightness_mode: >-
    {{ ('slot_only' if day_own_brightness else 'override_slot') if day_preset_source == 'time_slot'
       else ('button_own' if day_own_brightness else 'button_slot') if day_preset_source == 'button'
       else ('keep_own' if day_own_brightness else 'override_current') }}
  # round + int: light.turn_on/scene_presets.apply_preset reject a float
  # brightness outright ("expected int"), and the pct->255 scaling above
  # always produces one (e.g. 100% -> 255.0), even from an integer input.
  #
  # Below, whenever a preset is applied and the brightness key must be
  # conditionally left out entirely (so the preset's own brightness wins),
  # the scene_presets.apply_preset actions build their whole `data:` as one
  # `{{ ... | combine(...) }}` expression instead of templating a bare
  # `brightness: >- {{ omit if ... else ... }}` field. The `omit` sentinel
  # does not reliably drop the key this way in practice — it has been
  # observed rendering as an empty string instead (still present as
  # `brightness: ""`, which then fails the same "expected int" validation
  # this comment already warns about) — so `combine` is used instead,
  # since a dict filter is explicit about which keys exist rather than
  # relying on a template sentinel to vanish one.
  day_brightness: "{{ ((day_brightness_pct | float) * 255 / 100) | round | int }}"
  evening_brightness_pct: !input evening_brightness_pct
  evening_preset_source: !input evening_preset_source
  evening_own_brightness: !input evening_own_brightness
  evening_brightness_mode: >-
    {{ ('slot_only' if evening_own_brightness else 'override_slot') if evening_preset_source == 'time_slot'
       else ('button_own' if evening_own_brightness else 'button_slot') if evening_preset_source == 'button'
       else ('keep_own' if evening_own_brightness else 'override_current') }}
  evening_brightness: "{{ ((evening_brightness_pct | float) * 255 / 100) | round | int }}"
  night_brightness_pct: !input night_brightness_pct
  night_preset_source: !input night_preset_source
  night_own_brightness: !input night_own_brightness
  night_brightness_mode: >-
    {{ ('slot_only' if night_own_brightness else 'override_slot') if night_preset_source == 'time_slot'
       else ('button_own' if night_own_brightness else 'button_slot') if night_preset_source == 'button'
       else ('keep_own' if night_own_brightness else 'override_current') }}
  night_brightness: "{{ ((night_brightness_pct | float) * 255 / 100) | round | int }}"
  day_start_use_sunrise: !input day_start_use_sunrise
  evening_start_use_sunset: !input evening_start_use_sunset
  media_players_on: !input media_players_on
  media_hold_limit: !input media_hold_limit
  media_players_ignore: !input media_players_ignore
  # When the room's sensors last went quiet: the earliest moment one sensor
  # class (motion or occupancy) had all its sensors clear — the same reading
  # of "quiet" the triggers use. Empty while every class still detects.
  room_quiet_since: >-
    {%- set ents = room_list | map('area_entities') | sum(start=[])
          | select('match', 'binary_sensor\.') | list -%}
    {%- set sensors = expand(ents) | selectattr('attributes.device_class', 'defined') | list -%}
    {%- set ns = namespace(quiet=none) -%}
    {%- for cls in ['motion', 'occupancy'] -%}
      {%- set s = sensors | selectattr('attributes.device_class', 'eq', cls) | list -%}
      {%- if s | count > 0 and s | selectattr('state', 'eq', 'on') | list | count == 0 -%}
        {%- set t = s | map(attribute='last_changed') | max -%}
        {%- if ns.quiet is none or t < ns.quiet -%}{%- set ns.quiet = t -%}{%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.quiet if ns.quiet is not none else '' }}
  # When the current slot began, for "a light changed by hand during this
  # slot is left alone" below. A sunrise/sunset boundary is read from the
  # sun's next rising/setting (already tomorrow's once it has passed) minus
  # one day — a few minutes off, which doesn't matter here: it only decides
  # whether a light that is *not* at the slot's level was changed before or
  # after the slot began.
  night_start_time: !input night_start
  day_start_time: !input day_start
  evening_start_time: !input evening_start
  night_started_at: >-
    {{ today_at(night_start_time) if now() >= today_at(night_start_time)
       else today_at(night_start_time) - timedelta(days=1) }}
  evening_started_at: >-
    {%- set s = state_attr('sun.sun', 'next_setting') -%}
    {{ (s | as_datetime - timedelta(days=1)) if evening_start_use_sunset and s
       else today_at(evening_start_time) }}
  day_started_at: >-
    {%- set s = state_attr('sun.sun', 'next_rising') -%}
    {{ (s | as_datetime - timedelta(days=1)) if day_start_use_sunrise and s
       else today_at(day_start_time) }}
  # Which slot it is now. Templates rather than native time/sun conditions
  # switched by `enabled:` — an `enabled:` template can't see these inputs,
  # so the sunrise/sunset toggles never took effect that way. Sun boundaries
  # read sun.sun: the next rising is still today until today's sunrise has
  # passed, and the next setting is already tomorrow once today's sunset has.
  is_night: >-
    {%- set r = state_attr('sun.sun', 'next_rising') -%}
    {%- set before_morning = ((r | as_datetime | as_local).date() == now().date())
          if day_start_use_sunrise and r else now() < today_at(day_start_time) -%}
    {{ now() >= today_at(night_start_time) or before_morning }}
  is_evening: >-
    {%- set s = state_attr('sun.sun', 'next_setting') -%}
    {{ ((s | as_datetime | as_local).date() > now().date())
       if evening_start_use_sunset and s else now() >= today_at(evening_start_time) }}
  day_at_start: !input day_at_start
  evening_at_start: !input evening_at_start
  night_at_start: !input night_at_start
  day_start_transition: !input day_start_transition
  evening_start_transition: !input evening_start_transition
  night_start_transition: !input night_start_transition
  dim_brightness_pct: !input dim_brightness_pct
  # Every light/scene service call below takes `transition` in seconds. The
  # fade-out and fade-in are input in seconds already; only the already-lit
  # transition is input in minutes and converted here. The fade-out keeps its
  # original input key `transition` (once a 0-30 minute slider) so existing
  # automations don't lose their setting; it is now read as seconds.
  transition: !input transition
  transition_seconds: "{{ transition | float }}"
  dim_flag_entity: !input dim_flag
  fade_in_seconds: !input fade_in_seconds
  lit_transition: !input lit_transition
  lit_transition_seconds: "{{ [(lit_transition | float) * 60, 300] | min }}"
  # The area selector yields a list, but an instance saved before this input
  # became multi-select still holds a bare string — accept both.
  room_list: "{{ [room] if room is string else room }}"
  # Single source of truth for what this automation controls: the override
  # when set, every light in the areas otherwise. Resolved at run time, so
  # moving a light between areas is picked up without editing anything.
  #
  # The derived branch also drops any light listed under "Lights to
  # exclude", and drops light *groups* (an entity whose own state
  # carries an entity_id attribute listing members, e.g. a Hue room/zone
  # light or a light group helper — or a group_entities attribute, e.g. a
  # ZHA Zigbee group) so a group and its members aren't both snapshotted
  # and driven — snapshotting a member changes the group's state too, so
  # scene.turn_on would fight itself restoring both. An explicit override
  # is trusted as-is; if you deliberately listed a group, that's your call.
  light_entities: >-
    {% if (lights | count) > 0 -%}
    {{ lights }}
    {%- else -%}
    {%- set candidates = room_list | map('area_entities') | sum(start=[])
        | select('match', 'light\.') | list -%}
    {%- set ns = namespace(out=[]) -%}
    {%- for e in candidates -%}
      {%- if state_attr(e, 'entity_id') is none and state_attr(e, 'group_entities') is none
            and e not in lights_exclude -%}
        {%- set ns.out = ns.out + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.out }}
    {%- endif %}
  # One snapshot scene per instance, so several cannot overwrite each
  # other's memory.
  snapshot_scene_id: "presence_snapshot_{{ room_list | join('_') }}"
  snapshot_entity: "scene.presence_snapshot_{{ room_list | join('_') }}"
  # Deliberately the same formula the Hue Tap Dial and Hue Smart Button
  # blueprints use for this helper, so all three agree on its name without
  # any of them telling the others what they picked — see those
  # blueprints' "Room" input. The helper doesn't need to exist: a room
  # with no remote simply has nothing to restore here yet (see the
  # fallback's own read below).
  last_preset_helper: "input_text.{{ room_list | join('_') }}_laatste_preset"

# The "missed switch-off" template trigger below is rendered before the
# `variables:` above exist, so it gets the inputs it needs from here.
trigger_variables:
  tv_room: !input room
  tv_lights: !input lights
  tv_lights_exclude: !input lights_exclude
  tv_dim_flag: !input dim_flag
  tv_dim_after: !input no_motion_dim_after
  tv_off_after: !input no_motion_off_after
  tv_media_on: !input media_players_on
  tv_media_hold_limit: !input media_hold_limit
  tv_media_ignore: !input media_players_ignore

triggers:
  # Motion and occupancy are two independent purpose-specific families, so a
  # room needs both trigger pairs to react to whichever class its sensor(s)
  # expose. Some devices report only one of the two (e.g. a plain PIR sensor
  # has no occupancy entity); others expose both from the same device, where
  # they can behave differently (a stuck/quirk-less motion cluster that never
  # clears vs. a reliably-timed occupancy cluster) — sharing the same trigger
  # id below means either firing drives the same branch, so the room still
  # works correctly even if one of the two classes is unreliable.
  - trigger: motion.detected
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  - trigger: occupancy.detected
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  # The purpose-specific triggers above ignore a sensor that goes straight
  # from unavailable to detected, so a battery sensor that dropped offline
  # and recovers as someone walks in never fires them. This catches exactly
  # that transition, for the sensors listed under "Sensors that can drop
  # offline" (a state trigger can't take an area, hence the explicit list).
  # Normal off -> on detections are not matched here, so nothing fires twice.
  - trigger: state
    entity_id: !input recovery_sensors
    from:
      - unavailable
      - unknown
    to: "on"
    id: motion
  - trigger: motion.cleared
    target:
      area_id: !input room
    options:
      for: !input no_motion_dim_after
      behavior: each
    id: no_motion
  - trigger: occupancy.cleared
    target:
      area_id: !input room
    options:
      for: !input no_motion_dim_after
      behavior: each
    id: no_motion
  # Shares the "motion" id so starting playback cancels a pending dim/off
  # countdown exactly like returning motion does (mode: restart) — fixes a
  # room going dark mid-film because nobody moved after pressing play.
  - trigger: media_player.started_playing
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  # A listed "counts while on" player being switched on cancels a pending
  # dim/off countdown, like starting playback does above.
  - trigger: state
    entity_id: !input media_players_on
    from:
      - "off"
      - standby
      - unavailable
      - unknown
    not_to:
      - "off"
      - standby
      - unavailable
      - unknown
    id: motion
  # Slot boundaries. Both the fixed-time and the sun variant always attach;
  # the condition below keeps only the one the room is set to.
  - trigger: time
    at: !input day_start
    id: morning
  - trigger: sun
    event: sunrise
    id: morning
  - trigger: time
    at: !input evening_start
    id: evening_start
  - trigger: sun
    event: sunset
    id: evening_start
  - trigger: time
    at: !input night_start
    id: night_start
  # Safety net for a missed switch-off. The "no motion" triggers above count
  # down inside Home Assistant, and that countdown is lost whenever the
  # automation reloads (saving it, re-importing this blueprint, a restart)
  # mid-way — after which nothing fires again until the next motion, so a
  # light can stay on all night in an empty room. This template re-checks
  # once a minute (it uses now()) and fires when a light is still on and
  # the room has been quiet longer than the normal dim (+ switch-off) delay
  # plus 2 minutes of slack, so it never races the normal path. "Quiet" is
  # read the same way the triggers above work: either sensor class
  # (motion or occupancy) having all its sensors clear counts, so a stuck
  # motion sensor next to a working occupancy sensor doesn't block it. The
  # clock starts at whichever came last: the room going quiet, or a light
  # being switched on — a light switched on in an empty room also goes
  # through the normal dim and switch-off, just counted from that moment.
  - trigger: template
    id: missed_off
    value_template: >-
      {%- set rl = [tv_room] if tv_room is string else tv_room -%}
      {%- set area_ents = rl | map('area_entities') | sum(start=[]) -%}
      {%- if tv_lights | count > 0 -%}
        {%- set lights = expand(tv_lights) -%}
      {%- else -%}
        {%- set lights = expand(area_ents | select('match', 'light\.') | list)
              | rejectattr('attributes.entity_id', 'defined')
              | rejectattr('attributes.group_entities', 'defined')
              | rejectattr('entity_id', 'in', tv_lights_exclude) | list -%}
      {%- endif -%}
      {%- set lit = lights | selectattr('state', 'eq', 'on') | list -%}
      {%- set sensors = expand(area_ents | select('match', 'binary_sensor\.') | list)
            | selectattr('attributes.device_class', 'defined') | list -%}
      {%- set ns = namespace(quiet=none) -%}
      {%- for cls in ['motion', 'occupancy'] -%}
        {%- set s = sensors | selectattr('attributes.device_class', 'eq', cls) | list -%}
        {%- if s | count > 0 and s | selectattr('state', 'eq', 'on') | list | count == 0 -%}
          {%- set t = s | map(attribute='last_changed') | max -%}
          {%- if ns.quiet is none or t < ns.quiet -%}{%- set ns.quiet = t -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set listed = expand(tv_media_on) -%}
      {%- set area_media = expand(area_ents | select('match', 'media_player\.') | list)
            | rejectattr('entity_id', 'in', tv_media_ignore) | list -%}
      {%- set hold = timedelta(days=tv_media_hold_limit.days | default(0), hours=tv_media_hold_limit.hours | default(0),
            minutes=tv_media_hold_limit.minutes | default(0), seconds=tv_media_hold_limit.seconds | default(0)) -%}
      {%- set listed_on = listed | rejectattr('state', 'in', ['off', 'standby', 'unavailable', 'unknown']) | list | count > 0 -%}
      {%- set busy = (listed_on and (ns.quiet is none or now() - ns.quiet < hold))
            or (area_media | selectattr('state', 'eq', 'playing') | list | count > 0) -%}
      {%- if lit | count > 0 and ns.quiet is not none and not busy -%}
        {%- set times = [ns.quiet, lit | map(attribute='last_changed') | max]
              + (listed + area_media) | map(attribute='last_changed') | list -%}
        {%- set since = times | max -%}
        {%- set dim = timedelta(days=tv_dim_after.days | default(0), hours=tv_dim_after.hours | default(0),
              minutes=tv_dim_after.minutes | default(0), seconds=tv_dim_after.seconds | default(0)) -%}
        {%- set off = timedelta(days=tv_off_after.days | default(0), hours=tv_off_after.hours | default(0),
              minutes=tv_off_after.minutes | default(0), seconds=tv_off_after.seconds | default(0)) -%}
        {%- set wait = dim + timedelta(minutes=2) if is_state(tv_dim_flag, 'off') else dim + off + timedelta(minutes=2) -%}
        {{ now() - since > wait }}
      {%- else -%}
        false
      {%- endif -%}

conditions:
  # An ignored media player starting to play must not restart the
  # automation (mode: restart would cancel a dim or switch-off in progress).
  # trigger.entity_id is undefined for the time/sun/template triggers.
  - alias: Not an ignored media player
    condition: template
    value_template: >-
      {{ trigger.entity_id is not defined
         or trigger.entity_id not in media_players_ignore }}
  # A slot boundary only runs when it has something to do — otherwise it
  # would needlessly restart (and so cancel) a dim already in progress.
  # Easing needs a light that is on and no warning dim of ours under way.
  - alias: Only the slot boundary this room uses, and only with work to do
    condition: template
    value_template: >-
      {%- set lit = expand(light_entities) | selectattr('state', 'eq', 'on') | list | count > 0 -%}
      {%- set can_ease = lit and is_state(dim_flag_entity, 'off') -%}
      {%- if trigger.id == 'morning' -%}
        {{ (trigger.platform == 'sun') == day_start_use_sunrise
           and (states(last_preset_helper) not in ['', 'unknown']
                or (day_at_start == 'ease' and can_ease)) }}
      {%- elif trigger.id == 'evening_start' -%}
        {{ (trigger.platform == 'sun') == evening_start_use_sunset
           and evening_at_start == 'ease' and can_ease }}
      {%- elif trigger.id == 'night_start' -%}
        {{ night_at_start == 'ease' and can_ease }}
      {%- else -%}
        true
      {%- endif -%}

actions:
  - choose:
      - alias: Someone is here
        conditions:
          - condition: trigger
            id: motion
        sequence:
          - choose:
              # Checked first, ahead of every memory branch below, so it
              # pre-empts all of them rather than being just another
              # fallback — that's the point of the toggle. Anchors the
              # night/evening time checks on their first use in the
              # document; the "Room is dark" branch further down reuses
              # them as plain aliases.
              - alias: Always apply the time-of-day preset, ignoring current state
                conditions:
                  - condition: template
                    value_template: "{{ force_preset_on_motion }}"
                sequence:
                  - choose:
                      - alias: Night
                        conditions:
                          - &is_night_now
                            condition: template
                            value_template: "{{ is_night }}"
                        sequence:
                          - variables:
                              slot_preset: "{{ preset_night }}"
                              slot_started_at: "{{ night_started_at }}"
                              slot_colour_data: "{{ night_colour_data }}"
                              # -1: leave the preset at its own brightness. A
                              # light colour has none, so it always gets the
                              # slot's brightness.
                              slot_brightness: >-
                                {{ night_brightness if (night_colour_data | count > 0 or night_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
                          # Shared by all three slots (aliased below). Lights
                          # that are off — or the whole room, while our warning
                          # dim is holding it down — get the quick fade-in;
                          # lights already on get the slow transition, and only
                          # if they aren't already at the slot's brightness. A
                          # light mid-fade already reports its target
                          # brightness, so repeated motion leaves that fade
                          # running instead of restarting it. With the preset's
                          # own brightness (-1) there's nothing to compare.
                          # A lit light that is off the slot's level but was
                          # changed after this slot began was set by hand
                          # (remote, dashboard, voice) — it is left alone for
                          # the rest of the slot instead of being pulled back
                          # on every motion; the next slot takes over again.
                          - &force_apply_slot
                            if:
                              - condition: template
                                value_template: "{{ slot_preset == 'off' }}"
                            then: &turn_off_sequence
                              - action: light.turn_off
                                target:
                                  entity_id: "{{ light_entities }}"
                                data:
                                  transition: "{{ transition_seconds }}"
                            else:
                              - variables:
                                  dimmed_by_us: "{{ is_state(dim_flag_entity, 'on') }}"
                                  dark_targets: >-
                                    {{ light_entities if dimmed_by_us
                                       else expand(light_entities) | rejectattr('state', 'eq', 'on')
                                            | map(attribute='entity_id') | list }}
                                  lit_targets: >-
                                    {%- set ns = namespace(out=[]) -%}
                                    {%- if not dimmed_by_us -%}
                                      {%- for s in expand(light_entities) | selectattr('state', 'eq', 'on') -%}
                                        {%- set b = s.attributes.brightness -%}
                                        {%- if ((slot_brightness | int) < 0 or b is none
                                              or ((b | int) - (slot_brightness | int)) | abs > 2)
                                              and s.last_updated < (slot_started_at | as_datetime) -%}
                                          {%- set ns.out = ns.out + [s.entity_id] -%}
                                        {%- endif -%}
                                      {%- endfor -%}
                                    {%- endif -%}
                                    {{ ns.out }}
                              - if:
                                  - condition: template
                                    value_template: "{{ dark_targets | count > 0 }}"
                                then:
                                  - action: "{{ 'light.turn_on' if slot_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                    data: >-
                                      {{ {'entity_id': dark_targets, 'brightness': slot_brightness | int, 'transition': fade_in_seconds | float} | combine(slot_colour_data)
                                         if slot_colour_data | count > 0 else
                                         {'preset_id': slot_preset, 'targets': {'entity_id': dark_targets}, 'transition': fade_in_seconds | float}
                                         | combine({'brightness': slot_brightness | int} if (slot_brightness | int) >= 0 else {}) }}
                              - if:
                                  - condition: template
                                    value_template: "{{ lit_targets | count > 0 }}"
                                then:
                                  - action: "{{ 'light.turn_on' if slot_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                    data: >-
                                      {{ {'entity_id': lit_targets, 'brightness': slot_brightness | int, 'transition': lit_transition_seconds | float} | combine(slot_colour_data)
                                         if slot_colour_data | count > 0 else
                                         {'preset_id': slot_preset, 'targets': {'entity_id': lit_targets}, 'transition': lit_transition_seconds | float}
                                         | combine({'brightness': slot_brightness | int} if (slot_brightness | int) >= 0 else {}) }}
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: !input dim_flag
                      - alias: Evening
                        conditions:
                          - &is_evening_now
                            condition: template
                            value_template: "{{ is_evening }}"
                        sequence:
                          - variables:
                              slot_preset: "{{ preset_evening }}"
                              slot_started_at: "{{ evening_started_at }}"
                              slot_colour_data: "{{ evening_colour_data }}"
                              slot_brightness: >-
                                {{ evening_brightness if (evening_colour_data | count > 0 or evening_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
                          - *force_apply_slot
                    default:
                      - variables:
                          slot_preset: "{{ preset_day }}"
                          slot_started_at: "{{ day_started_at }}"
                          slot_colour_data: "{{ day_colour_data }}"
                          slot_brightness: >-
                            {{ day_brightness if (day_colour_data | count > 0 or day_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
                      - *force_apply_slot
              - alias: We dimmed it, so put back exactly what was there
                conditions:
                  - condition: state
                    entity_id: !input dim_flag
                    state: "on"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ snapshot_entity }}"
                    data:
                      transition: "{{ fade_in_seconds }}"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input dim_flag
              # The controlled set is resolved at run time, so a native
              # light.is_on condition cannot address it — its target is
              # validated at load, before light_entities exists.
              - alias: Room is dark, so bring back its memory
                conditions:
                  - condition: template
                    value_template: >-
                      {{ expand(light_entities)
                         | selectattr('state', 'eq', 'on')
                         | list | count == 0 }}
                sequence:
                  - choose:
                      - alias: Night
                        conditions:
                          # Anchored above, in the "Always apply the
                          # time-of-day preset" branch (its first use in the
                          # document); reused here as a plain alias so the
                          # sunrise/sunset toggle can't drift out of sync
                          # between the two.
                          - *is_night_now
                        sequence:
                          - choose:
                              - alias: Time-of-day preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ night_brightness_mode in ['override_slot', 'slot_only'] }}
                                sequence:
                                  - if:
                                      - condition: template
                                        value_template: "{{ preset_night == 'off' }}"
                                    then: *turn_off_sequence
                                    else:
                                      - action: "{{ 'light.turn_on' if night_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                        data: >-
                                          {{ {'entity_id': light_entities, 'brightness': night_brightness, 'transition': fade_in_seconds | float} | combine(night_colour_data)
                                             if night_colour_data | count > 0 else
                                             {'preset_id': preset_night, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': night_brightness} if night_brightness_mode == 'override_slot' else {}) }}
                              - alias: Button preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ night_brightness_mode in ['button_own', 'button_slot'] }}
                                sequence:
                                  - choose:
                                      - alias: Last preset a remote applied
                                        conditions:
                                          - condition: template
                                            value_template: >-
                                              {{ states(last_preset_helper)
                                                 not in ['', 'unknown', 'unavailable'] }}
                                        sequence:
                                          - action: scene_presets.apply_preset
                                            data: >-
                                              {{ {'preset_id': states(last_preset_helper), 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                                 | combine({'brightness': night_brightness} if night_brightness_mode != 'button_own' else {}) }}
                                    default:
                                      - if:
                                          - condition: template
                                            value_template: "{{ preset_night == 'off' }}"
                                        then: *turn_off_sequence
                                        else:
                                          - action: "{{ 'light.turn_on' if night_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                            data: >-
                                              {{ {'entity_id': light_entities, 'brightness': night_brightness, 'transition': fade_in_seconds | float} | combine(night_colour_data)
                                                 if night_colour_data | count > 0 else
                                                 {'preset_id': preset_night, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                                 | combine({'brightness': night_brightness} if night_brightness_mode != 'button_own' else {}) }}
                            default:
                              # Keep current light settings: restore the
                              # snapshot from the moment the room last went
                              # quiet, then — only for the slot-brightness
                              # variant — pin the brightness that leaves the
                              # room at, without changing what it's showing.
                              - choose:
                                  # The snapshot entity is per-room and
                                  # therefore dynamic, so a native state
                                  # condition cannot address it.
                                  - alias: Last known state
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(snapshot_entity)
                                             not in ['unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene.turn_on
                                        target:
                                          entity_id: "{{ snapshot_entity }}"
                                        data:
                                          transition: "{{ fade_in_seconds }}"
                                      - if:
                                          - condition: template
                                            value_template: "{{ night_brightness_mode == 'override_current' }}"
                                        then:
                                          - action: light.turn_on
                                            target:
                                              entity_id: "{{ light_entities }}"
                                            data:
                                              brightness: "{{ night_brightness }}"
                                              transition: "{{ fade_in_seconds }}"
                                default:
                                  - if:
                                      - condition: template
                                        value_template: "{{ preset_night == 'off' }}"
                                    then: *turn_off_sequence
                                    else:
                                      - action: "{{ 'light.turn_on' if night_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                        data: >-
                                          {{ {'entity_id': light_entities, 'brightness': night_brightness, 'transition': fade_in_seconds | float} | combine(night_colour_data)
                                             if night_colour_data | count > 0 else
                                             {'preset_id': preset_night, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': night_brightness} if night_brightness_mode != 'keep_own' else {}) }}
                      - alias: Evening
                        conditions:
                          - *is_evening_now
                        sequence:
                          - choose:
                              - alias: Time-of-day preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ evening_brightness_mode in ['override_slot', 'slot_only'] }}
                                sequence:
                                  - if:
                                      - condition: template
                                        value_template: "{{ preset_evening == 'off' }}"
                                    then: *turn_off_sequence
                                    else:
                                      - action: "{{ 'light.turn_on' if evening_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                        data: >-
                                          {{ {'entity_id': light_entities, 'brightness': evening_brightness, 'transition': fade_in_seconds | float} | combine(evening_colour_data)
                                             if evening_colour_data | count > 0 else
                                             {'preset_id': preset_evening, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': evening_brightness} if evening_brightness_mode == 'override_slot' else {}) }}
                              - alias: Button preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ evening_brightness_mode in ['button_own', 'button_slot'] }}
                                sequence:
                                  - choose:
                                      - alias: Last preset a remote applied
                                        conditions:
                                          - condition: template
                                            value_template: >-
                                              {{ states(last_preset_helper)
                                                 not in ['', 'unknown', 'unavailable'] }}
                                        sequence:
                                          - action: scene_presets.apply_preset
                                            data: >-
                                              {{ {'preset_id': states(last_preset_helper), 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                                 | combine({'brightness': evening_brightness} if evening_brightness_mode != 'button_own' else {}) }}
                                    default:
                                      - if:
                                          - condition: template
                                            value_template: "{{ preset_evening == 'off' }}"
                                        then: *turn_off_sequence
                                        else:
                                          - action: "{{ 'light.turn_on' if evening_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                            data: >-
                                              {{ {'entity_id': light_entities, 'brightness': evening_brightness, 'transition': fade_in_seconds | float} | combine(evening_colour_data)
                                                 if evening_colour_data | count > 0 else
                                                 {'preset_id': preset_evening, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                                 | combine({'brightness': evening_brightness} if evening_brightness_mode != 'button_own' else {}) }}
                            default:
                              # Keep current light settings — see the Night
                              # slot above for why only the slot-brightness
                              # variant pins brightness afterward.
                              - choose:
                                  - alias: Last known state
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(snapshot_entity)
                                             not in ['unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene.turn_on
                                        target:
                                          entity_id: "{{ snapshot_entity }}"
                                        data:
                                          transition: "{{ fade_in_seconds }}"
                                      - if:
                                          - condition: template
                                            value_template: "{{ evening_brightness_mode == 'override_current' }}"
                                        then:
                                          - action: light.turn_on
                                            target:
                                              entity_id: "{{ light_entities }}"
                                            data:
                                              brightness: "{{ evening_brightness }}"
                                              transition: "{{ fade_in_seconds }}"
                                default:
                                  - if:
                                      - condition: template
                                        value_template: "{{ preset_evening == 'off' }}"
                                    then: *turn_off_sequence
                                    else:
                                      - action: "{{ 'light.turn_on' if evening_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                        data: >-
                                          {{ {'entity_id': light_entities, 'brightness': evening_brightness, 'transition': fade_in_seconds | float} | combine(evening_colour_data)
                                             if evening_colour_data | count > 0 else
                                             {'preset_id': preset_evening, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': evening_brightness} if evening_brightness_mode != 'keep_own' else {}) }}
                    default:
                      # Daytime.
                      - choose:
                          - alias: Time-of-day preset
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{ day_brightness_mode in ['override_slot', 'slot_only'] }}
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ preset_day == 'off' }}"
                                then: *turn_off_sequence
                                else:
                                  - action: "{{ 'light.turn_on' if day_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                    data: >-
                                      {{ {'entity_id': light_entities, 'brightness': day_brightness, 'transition': fade_in_seconds | float} | combine(day_colour_data)
                                         if day_colour_data | count > 0 else
                                         {'preset_id': preset_day, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                         | combine({'brightness': day_brightness} if day_brightness_mode == 'override_slot' else {}) }}
                          - alias: Button preset
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{ day_brightness_mode in ['button_own', 'button_slot'] }}
                            sequence:
                              - choose:
                                  - alias: Last preset a remote applied
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(last_preset_helper)
                                             not in ['', 'unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene_presets.apply_preset
                                        data: >-
                                          {{ {'preset_id': states(last_preset_helper), 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': day_brightness} if day_brightness_mode != 'button_own' else {}) }}
                                default:
                                  - if:
                                      - condition: template
                                        value_template: "{{ preset_day == 'off' }}"
                                    then: *turn_off_sequence
                                    else:
                                      - action: "{{ 'light.turn_on' if day_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                        data: >-
                                          {{ {'entity_id': light_entities, 'brightness': day_brightness, 'transition': fade_in_seconds | float} | combine(day_colour_data)
                                             if day_colour_data | count > 0 else
                                             {'preset_id': preset_day, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                             | combine({'brightness': day_brightness} if day_brightness_mode != 'button_own' else {}) }}
                        default:
                          # Keep current light settings — see the Night slot
                          # above for why only the slot-brightness variant
                          # pins brightness afterward.
                          - choose:
                              - alias: Last known state
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ states(snapshot_entity)
                                         not in ['unknown', 'unavailable'] }}
                                sequence:
                                  - action: scene.turn_on
                                    target:
                                      entity_id: "{{ snapshot_entity }}"
                                    data:
                                      transition: "{{ fade_in_seconds }}"
                                  - if:
                                      - condition: template
                                        value_template: "{{ day_brightness_mode == 'override_current' }}"
                                    then:
                                      - action: light.turn_on
                                        target:
                                          entity_id: "{{ light_entities }}"
                                        data:
                                          brightness: "{{ day_brightness }}"
                                          transition: "{{ fade_in_seconds }}"
                            default:
                              - if:
                                  - condition: template
                                    value_template: "{{ preset_day == 'off' }}"
                                then: *turn_off_sequence
                                else:
                                  - action: "{{ 'light.turn_on' if day_colour_data | count > 0 else 'scene_presets.apply_preset' }}"
                                    data: >-
                                      {{ {'entity_id': light_entities, 'brightness': day_brightness, 'transition': fade_in_seconds | float} | combine(day_colour_data)
                                         if day_colour_data | count > 0 else
                                         {'preset_id': preset_day, 'targets': {'entity_id': light_entities}, 'transition': fade_in_seconds | float}
                                         | combine({'brightness': day_brightness} if day_brightness_mode != 'keep_own' else {}) }}
            default:
              # Room already has a light on — not caught by the dim-flag or
              # dark-room branches above, and force_preset_on_motion is off
              # (that would have pre-empted this whole choose). A remote or
              # app may have just set a scene here on purpose, so the preset
              # itself is never touched. Brightness is a different matter:
              # only sync it, and only for "keep current light settings, at
              # the slot's brightness" ('override_current') — the same
              # condition the "Room is dark" branch above checks before
              # pinning brightness on a restored preset, just without
              # needing the room to have gone fully dark first. Every other
              # combination is left alone here; forcing one onto an
              # already-lit room is what force_preset_on_motion is for.
              - choose:
                  - alias: Night
                    conditions:
                      - *is_night_now
                    sequence:
                      - condition: template
                        value_template: "{{ night_brightness_mode == 'override_current' }}"
                      - variables:
                          slot_brightness: "{{ night_brightness }}"
                          slot_started_at: "{{ night_started_at }}"
                      # Shared by all three slots (aliased below). A light mid-fade
                      # already reports its target brightness, so it is skipped here
                      # and repeated motion lets the fade run on instead of restarting
                      # it. Lights still off in a partly lit room are included.
                      # A light changed after this slot began (by hand) is left
                      # alone until the next slot — see the forced branch above.
                      - &lit_brightness_sync
                        variables:
                          lit_targets: >-
                            {%- set ns = namespace(out=[]) -%}
                            {%- for s in expand(light_entities) -%}
                              {%- set b = s.attributes.brightness -%}
                              {%- if (s.state != 'on' or b is none
                                    or ((b | int) - (slot_brightness | int)) | abs > 2)
                                    and s.last_updated < (slot_started_at | as_datetime) -%}
                                {%- set ns.out = ns.out + [s.entity_id] -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.out }}
                      - &lit_brightness_apply
                        if:
                          - condition: template
                            value_template: "{{ lit_targets | count > 0 }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ lit_targets }}"
                            data:
                              brightness: "{{ slot_brightness }}"
                              transition: "{{ lit_transition_seconds }}"
                  - alias: Evening
                    conditions:
                      - *is_evening_now
                    sequence:
                      - condition: template
                        value_template: "{{ evening_brightness_mode == 'override_current' }}"
                      - variables:
                          slot_brightness: "{{ evening_brightness }}"
                          slot_started_at: "{{ evening_started_at }}"
                      - *lit_brightness_sync
                      - *lit_brightness_apply
                default:
                  # Daytime
                  - condition: template
                    value_template: "{{ day_brightness_mode == 'override_current' }}"
                  - variables:
                      slot_brightness: "{{ day_brightness }}"
                      slot_started_at: "{{ day_started_at }}"
                  - *lit_brightness_sync
                  - *lit_brightness_apply
      - alias: Room has gone quiet
        conditions:
          - condition: trigger
            id: no_motion
        sequence: &quiet_sequence
          - alias: Nothing to dim if the room is already dark
            condition: template
            value_template: >-
              {{ expand(light_entities)
                 | selectattr('state', 'eq', 'on')
                 | list | count > 0 }}
          # A template rather than media_player.is_playing over the area, so
          # "Media players to ignore" can be left out.
          - alias: Not while media is playing in the room
            condition: template
            value_template: >-
              {{ expand(room_list | map('area_entities') | sum(start=[])
                        | select('match', 'media_player\.') | list)
                 | rejectattr('entity_id', 'in', media_players_ignore)
                 | selectattr('state', 'eq', 'playing')
                 | list | count == 0 }}
          - alias: Not while a "counts while on" media player is on (up to its limit)
            condition: template
            value_template: >-
              {%- set on = expand(media_players_on)
                    | rejectattr('state', 'in', ['off', 'standby', 'unavailable', 'unknown'])
                    | list | count > 0 -%}
              {%- set lim = timedelta(days=media_hold_limit.days | default(0), hours=media_hold_limit.hours | default(0),
                    minutes=media_hold_limit.minutes | default(0), seconds=media_hold_limit.seconds | default(0)) -%}
              {{ not on or (room_quiet_since | string | length > 0
                            and now() - (room_quiet_since | as_datetime) >= lim) }}
          - alias: Remember exactly how the light stands now
            action: scene.create
            data:
              scene_id: "{{ snapshot_scene_id }}"
              snapshot_entities: "{{ light_entities }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input dim_flag
          # brightness_step_pct is relative to each light's own current
          # brightness, not an absolute target — so a light already dim only
          # drops a little further instead of being pushed up to a fixed
          # level. That makes "never brighten" automatic, with no threshold
          # check needed. Off lights are excluded; a step has nothing to
          # step from and should not switch them on.
          - alias: Dim as a warning
            action: light.turn_on
            target:
              entity_id: >-
                {{ expand(light_entities)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id') | list }}
            data:
              brightness_step_pct: "{{ -1 * (dim_brightness_pct | float) }}"
              transition: "{{ transition_seconds }}"
          # Returning motion restarts the automation and cancels this wait.
          - delay: !input no_motion_off_after
          - alias: Still quiet, so switch off
            action: light.turn_off
            target:
              entity_id: "{{ light_entities }}"
            data:
              transition: "{{ transition_seconds }}"
          - action: input_boolean.turn_off
            target:
              entity_id: !input dim_flag
      - alias: A switch-off was missed, so catch up
        conditions:
          - condition: trigger
            id: missed_off
        sequence:
          - if:
              # The warning dim already happened but its switch-off was
              # lost: the dim has lasted long enough, so go straight to off.
              - condition: state
                entity_id: !input dim_flag
                state: "on"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ light_entities }}"
                data:
                  transition: "{{ transition_seconds }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: !input dim_flag
            else: *quiet_sequence
      - alias: New day begins
        conditions:
          - condition: trigger
            id: morning
        sequence:
          - choose:
              - alias: Forget the button preset
                conditions:
                  # Same 'unknown' reading as everywhere else in this
                  # blueprint: a room with no remote has no such helper, so
                  # there's nothing to clear.
                  - condition: template
                    value_template: "{{ states(last_preset_helper) != 'unknown' }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ last_preset_helper }}"
                    data:
                      value: ""
          - if:
              - condition: template
                value_template: "{{ day_at_start == 'ease' }}"
            then:
              - variables:
                  slot_preset: "{{ preset_day }}"
                  slot_colour_data: "{{ day_colour_data }}"
                  slot_source: "{{ day_preset_source }}"
                  ease_seconds: "{{ day_start_transition }}"
                  slot_brightness: >-
                    {{ day_brightness if (day_colour_data | count > 0 or day_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
              # Lit lights ease over to the new slot; lights that are off
              # stay off — switching lights on in an empty room is not this
              # automation's job. What they ease to follows the slot's
              # "On motion" choice: its own light (also for a remote preset,
              # whose memory a new day has just cleared), or — for "Last light
              # settings" — only the slot's brightness, keeping the colour.
              - &ease_to_slot
                if:
                  - condition: template
                    value_template: "{{ is_state(dim_flag_entity, 'off') }}"
                then:
                  - variables:
                      ease_targets: >-
                        {{ expand(light_entities) | selectattr('state', 'eq', 'on')
                           | map(attribute='entity_id') | list }}
                      ease_preset: >-
                        {{ states(last_preset_helper)
                           if (slot_source == 'button' and not force_preset_on_motion
                               and states(last_preset_helper) not in ['', 'unknown', 'unavailable'])
                           else slot_preset }}
                      ease_colour: "{{ slot_colour_data if ease_preset == slot_preset else {} }}"
                  - condition: template
                    value_template: "{{ ease_targets | count > 0 }}"
                  - choose:
                      - alias: Keep what's showing, only take the slot's brightness
                        conditions:
                          - condition: template
                            value_template: "{{ slot_source == 'last' and not force_preset_on_motion }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ (slot_brightness | int) >= 0 }}"
                            then:
                              - action: light.turn_on
                                target:
                                  entity_id: "{{ ease_targets }}"
                                data:
                                  brightness: "{{ slot_brightness }}"
                                  transition: "{{ ease_seconds }}"
                      - alias: Slot is set to off
                        conditions:
                          - condition: template
                            value_template: "{{ ease_preset == 'off' }}"
                        sequence:
                          - action: light.turn_off
                            target:
                              entity_id: "{{ ease_targets }}"
                            data:
                              transition: "{{ ease_seconds }}"
                    default:
                      - action: "{{ 'light.turn_on' if ease_colour | count > 0 else 'scene_presets.apply_preset' }}"
                        data: >-
                          {{ {'entity_id': ease_targets, 'brightness': slot_brightness | int, 'transition': ease_seconds | float} | combine(ease_colour)
                             if ease_colour | count > 0 else
                             {'preset_id': ease_preset, 'targets': {'entity_id': ease_targets}, 'transition': [ease_seconds | float, 300] | min}
                             | combine({'brightness': slot_brightness | int} if (slot_brightness | int) >= 0 else {}) }}
      - alias: The evening begins
        conditions:
          - condition: trigger
            id: evening_start
        sequence:
          - variables:
              slot_preset: "{{ preset_evening }}"
              slot_colour_data: "{{ evening_colour_data }}"
              slot_source: "{{ evening_preset_source }}"
              ease_seconds: "{{ evening_start_transition }}"
              slot_brightness: >-
                {{ evening_brightness if (evening_colour_data | count > 0 or evening_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
          - *ease_to_slot
      - alias: The night begins
        conditions:
          - condition: trigger
            id: night_start
        sequence:
          - variables:
              slot_preset: "{{ preset_night }}"
              slot_colour_data: "{{ night_colour_data }}"
              slot_source: "{{ night_preset_source }}"
              ease_seconds: "{{ night_start_transition }}"
              slot_brightness: >-
                {{ night_brightness if (night_colour_data | count > 0 or night_brightness_mode not in ['slot_only', 'button_own', 'keep_own']) else -1 }}
          - *ease_to_slot
