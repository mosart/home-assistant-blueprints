blueprint:
  name: "[mosart] Presence lighting with scene memory"
  description: >-
    Presence lighting for one room, written to defer to the scene already in
    use instead of overriding it.


    - **Motion while the room is dark**: restores the room's last known light
    state, falling back to the last preset a remote applied, then to the
    preset for the current time of day. During the daytime slot, the "Always
    use the Daytime preset during daytime" toggle (on by default) skips that
    memory and applies the Daytime preset outright, so the morning doesn't
    just pick up last night's mood; turn it off to restore memory during the
    day too. Each preset's time boundary sits next to it below — morning and
    evening can each use a fixed clock time or the sun's actual
    sunrise/sunset.

    - **Motion while dimmed**: puts back exactly what was on before the dim.

    - **No motion**: dims as a warning, then switches off.


    The "Always apply time-of-day preset on motion" toggle (off by default)
    replaces all of the above memory behaviour with something simpler and
    more predictable: every motion event applies the Daytime/Evening/Night
    preset for whatever slot it currently is, full stop — regardless of
    whether the light is already on, what it's currently showing, or why.
    Turn this on for a room where the light can end up in a state this
    blueprint never set (e.g. a smart bulb wired behind a physical wall
    switch, which powers back up at its own default brightness whenever the
    switch cuts and restores power) and a remembered state would be wrong
    more often than it would be right. This mode always brings the light to
    full brightness before applying the preset's colour — `apply_preset`
    alone only ever changes colour, so on a light that's already on (say,
    dimmed low by this same blueprint moments earlier) it would otherwise
    leave the existing, possibly barely-visible brightness untouched.


    Media playing or paused in the room postpones dimming and switching off.


    Pick one or more areas and it takes both the motion/occupancy sensors and
    the lights from them; an optional override lets you depart from that.
    Reacts to either class of sensor a room has — useful when a device's
    motion and occupancy entities behave differently (e.g. one is stuck or
    unreliable) or when different rooms use different sensor types.


    Requires the `scene_presets` custom integration
    (Hypfer/hass-scene_presets) and one `input_boolean` per instance — see
    the README.
  source_url: https://github.com/mosart/home-assistant-blueprints/blob/main/rooms/presence_lighting/presence_lighting.yaml
  domain: automation
  homeassistant:
    min_version: 2026.7.0
  input:
    room:
      name: Rooms
      description: >-
        The areas this automation covers. Their motion and occupancy sensors
        drive it (either fires the same behaviour — see the blueprint
        description), their lights are what it controls, and media players in
        them postpone dimming and switching off. Pick more than one to treat
        adjoining spaces as a single room.


        This field can't preview which sensors and lights that resolves to —
        Home Assistant's blueprint editor has no way to show computed results
        from another field. To check before saving: Settings → Areas → open
        the area — its entity list is the same one this automation reads,
        live. Light *groups* shown there are excluded automatically (see
        "Lights" below); everything else listed is included.
      selector:
        area:
          multiple: true
          multiple: true
    lights:
      name: Lights (override)
      description: >-
        Leave empty to control every light in the areas above — that is the
        normal case, and it follows the areas as you move devices between
        them. Set it only to depart from that: to control a subset, or to
        reach a light that lives in another area.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    dim_flag:
      name: Dimming flag helper
      description: >-
        An `input_boolean` this automation uses to remember that it was the
        one that dimmed the lights, so returning motion knows to put them
        back. Needs its own helper per room — do not share one between rooms.
      selector:
        entity:
          filter:
            - domain: input_boolean
    last_preset_helper:
      name: Last preset helper
      description: >-
        Optional `input_text` that a remote writes its applied preset to (see
        the Hue Tap Dial blueprint). Consulted when no snapshot is available.
        Leave empty to skip this fallback.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_text
    ignore_memory_in_daytime:
      name: Always use the Daytime preset during daytime
      description: >-
        On by default: motion in a dark room during the daytime slot always
        applies the Daytime preset below, even if a snapshot or a last
        preset is available. Night and evening are unaffected either way;
        they always restore memory first.

        Turn this off to restore the room's memory during the daytime slot
        too, the same as night and evening (last known state, then last
        remote preset, then the Daytime preset as a last resort).
      default: true
      selector:
        boolean: {}
    force_preset_on_motion:
      name: Always apply time-of-day preset on motion
      description: >-
        Off by default: motion follows the memory behaviour described above
        (put back the snapshot from before a dim, then the room's last known
        state, then the last remote preset, then the time-of-day preset as a
        last resort) — and does nothing at all if the light already appears
        to be on.

        Turn this on to skip all of that. Every motion event then applies
        the Daytime/Evening/Night preset below for whatever slot it
        currently is, unconditionally — including when the light is already
        on. Use this for a room where the light can be switched or
        power-cycled outside Home Assistant's control (a physical wall
        switch on a smart bulb's power is the common case: the bulb comes
        back at its own default brightness, which this blueprint would
        otherwise mistake for an intentional state and leave alone). Always
        brings the light to full brightness first, since applying a preset
        alone only ever changes colour, not brightness.
      default: false
      selector:
        boolean: {}
    preset_day:
      name: Daytime preset
      description: Applied when the room is dark and nothing is remembered.
      selector: &preset_selector
        select:
          mode: dropdown
          options:
