                  value: "18482f7d-4a18-4635-88c8-83c0695aa56c"
                - label: "Rustic — Amber robin"
                  value: "ae6319a6-7c4f-4f85-87b9-ade7dc8e2c26"
                - label: "Rustic — Woodland toadstool"
                  value: "ad0fe6ac-5877-4dc7-8386-6d4e8a17ea88"
                - label: "Rustic — Pumpkin spice"
                  value: "b592ea26-5c52-403d-9836-82140fc2b679"
                - label: "Rustic — Fall harvest"
                  value: "a2fc579f-71e5-47a1-af9d-43e8edd91c6e"
                - label: "Rustic — Pumpkin patch"
                  value: "1ae2c539-9afa-4870-bb29-061c255f2177"
                - label: "Misc Additions — SECAM"
                  value: "dbffbd71-7f65-428a-9ac7-0db51057d31a"
                - label: "Misc Additions — CGA"
                  value: "9565033d-f2ea-4821-bfba-7dd9b35be20a"
                - label: "Misc Additions — Light Cycles"
                  value: "97648e18-758a-4382-99a4-8b657f4bb098"
                - label: "Misc Additions — Valetudo"
                  value: "4bc4f958-b4af-46cf-8e67-636161e714f5"
                - label: "Winter whisper — Among the pines"
                  value: "84edbfd4-968f-4fe5-b4c6-484a0e5d4aff"
                - label: "Winter whisper — Fuchsia frost"
                  value: "7deef554-6a3a-4c92-b758-6a17aec25f02"
                - label: "Winter whisper — Icy glow"
                  value: "19175aca-cd4d-4e3d-b144-03f96edbf412"
                - label: "Winter whisper — Snow capped"
                  value: "83cb8a6c-1290-42d2-9760-5654e8e821a5"
                - label: "Sports live — Stadium"
                  value: "f587060a-c4a1-4885-87ff-54c247fb29e6"
                # END generated scene_presets options
        day_brightness_pct:
          name: Daytime preset brightness
          description: >-
            Brightness applied to the Daytime preset when the behaviour below
            calls for it. Defaults to 100% — mornings start at full brightness
            regardless of what the preset itself carries.
          default: 100
          selector: &brightness_pct_selector
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 1
        day_preset_source:
          name: Daytime preset on motion
          description: >-
            Which preset motion applies during the daytime slot, in a dark
            room:

            - **Time slot preset** (default): always the Daytime preset
            below — mornings reliably reset to a fixed look rather than pick
            up whatever mood was left over from the night before.

            - **Button preset (or time slot preset if none)**: the last
            preset a paired remote picked, falling back to the Daytime
            preset if nothing's been picked yet, or once a new day has
            forgotten it (see "Apply Daytime preset immediately each
            morning" below).

            - **Last light settings (or time slot preset if none)**: exactly
            how the lights stood the moment the room last went quiet —
            colour and all, whether that came from a preset, a remote, or a
            manual tweak the other two sources were never told about —
            falling back to the Daytime preset if nothing's been captured
            yet.

            In a room that's already lit, "Button preset" and "Time slot
            preset" leave it alone — a preset just set by hand from a
            remote, dashboard, or voice assistant isn't touched. "Last light
            settings" is the exception: with "Always use this slot's
            brightness" below, it still pins the brightness without
            touching what's showing, so a scene picked earlier in the
            evening still dims for the night instead of staying at whatever
            brightness it was set to.
          default: time_slot
          selector: &preset_source_selector
            select:
              mode: dropdown
              options:
                - label: "Time slot preset"
                  value: time_slot
                - label: "Button preset (or time slot preset if none)"
                  value: button
                - label: "Last light settings (or time slot preset if none)"
                  value: last
        day_own_brightness:
          name: Daytime preset brightness behaviour
          description: >-
            Off by default ("Always use this slot's brightness"): motion
            pins brightness to the level set above, whichever preset source
            above provided the colour/scene — mornings reset to a fixed
            brightness regardless of what that source carries. Turn on
            ("Use preset's own brightness") to leave whichever preset gets
            applied at its own brightness instead; the level set above then
            goes unused for motion in this slot.
          default: false
          selector: &own_brightness_selector
            boolean: {}
        day_start:
          name: Morning begins
          description: >-
            End of the night slot, and — unless overridden by the toggle below —
            the fixed time the daytime slot starts.
          default: "07:00:00"
          selector:
            time:
        day_start_use_sunrise:
          name: Use sunrise instead
          description: >-
            Off by default (the fixed time above applies). Turn on to use the
            sun's actual sunrise each day instead — the room then always wakes
            up with first light rather than a clock time that drifts against it
            across the seasons.
          default: false
          selector:
            boolean: {}
        day_start_apply_immediately:
          name: Apply Daytime preset immediately each morning
          description: >-
            Off by default: the morning boundary above only forgets the
            button preset (see "A new day begins" in the blueprint
            description) — the room keeps whatever it was already showing
            until its own first motion of the day applies the Daytime
            preset.

            Turn this on to apply the Daytime preset the moment the slot
            starts instead, whether or not anyone's there — useful for
            simulating presence while away.
          default: false
          selector:
            boolean: {}
    evening:
      name: Evening
      icon: mdi:weather-sunset
      input:
        preset_evening:
          name: Evening preset
          description: Applied after the evening slot starts, until the night slot begins.
          selector: *preset_selector
        evening_brightness_pct:
          name: Evening preset brightness
          description: >-
            Brightness applied to the Evening preset when the behaviour below
            calls for it. Defaults to 50%.
          default: 50
          selector: *brightness_pct_selector
        evening_preset_source:
          name: Evening preset on motion
          description: >-
            Same three sources as the Daytime slot above — see its
            description for what each one does. Defaults to "Last light
            settings", so a scene picked during the day carries into the
            evening instead of being overridden.
          default: last
          selector: *preset_source_selector
        evening_own_brightness:
          name: Evening preset brightness behaviour
          description: >-
            Same choice as the Daytime slot above — see its description.
            Off by default: the evening slot dims whatever's showing to the
            brightness set above instead of leaving it at the daytime level.
          default: false
          selector: *own_brightness_selector
        evening_start:
          name: Evening begins
          description: >-
            Unless overridden by the toggle below, the fixed time the evening
            slot starts.
          default: "18:00:00"
          selector:
            time:
        evening_start_use_sunset:
          name: Use sunset instead
          description: >-
            On by default, matching this blueprint's original behaviour: the
            evening slot starts at the sun's actual sunset each day rather than
            the fixed time above. Turn off to use a fixed clock time instead.
          default: true
          selector:
            boolean: {}
    night:
      name: Night
      icon: mdi:weather-night
      input:
        preset_night:
          name: Night preset
          description: >-
            Applied between the night boundary below and morning begins (set
            next to the Daytime preset above).
          selector: *preset_selector
        night_brightness_pct:
          name: Night preset brightness
          description: >-
            Brightness applied to the Night preset when the behaviour below
            calls for it. Defaults to 3% — a preset picked for its colour (e.g.
            a warm "Nightlight" look) doesn't necessarily come with a brightness
            that actually reads as dim once applied, so this pins it down
            independently of whichever preset is selected above.
          default: 3
          selector: *brightness_pct_selector
        night_preset_source:
          name: Night preset on motion
          description: >-
            Same three sources as the Daytime slot above — see its
            description for what each one does. Defaults to "Last light
            settings", so a room that's kept its evening scene into the
            night still shows it, just dimmed.
          default: last
          selector: *preset_source_selector
        night_own_brightness:
          name: Night preset brightness behaviour
          description: >-
            Same choice as the Daytime slot above — see its description.
            Off by default: the night slot dims whatever's showing to the
            brightness set above instead of leaving it at the evening level.
          default: false
          selector: *own_brightness_selector
        night_start:
          name: Night begins
          description: Start of the night slot.
          default: "23:00:00"
          selector:
            time:
    dim_behaviour:
      name: Dim & switch-off behaviour
      icon: mdi:brightness-4
      input:
        no_motion_dim_after:
          name: Dim after
          description: How long the room must be free of motion before dimming.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
        dim_brightness_pct:
          name: Dim by
          description: >-
            How much dimmer the warning makes the lights, as a percentage of
            their current brightness rather than a fixed target — a light
            already very dim only drops a little further, so the warning can
            never end up brighter than it was.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
              step: 1
        no_motion_off_after:
          name: Switch off after
          description: How long the dim lasts before the lights go out.
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration:
        transition:
          name: Transition time
          description: How smoothly each change is applied.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              unit_of_measurement: seconds
              mode: box
              step: 0.5

# restart: returning motion during the dim window must pre-empt the pending
# switch-off, and a fresh no-motion cycle must supersede the previous one.
mode: restart
max_exceeded: silent

variables:
  room: !input room
  lights: !input lights
  force_preset_on_motion: !input force_preset_on_motion
  day_brightness_pct: !input day_brightness_pct
  day_preset_source: !input day_preset_source
  day_own_brightness: !input day_own_brightness
  # Internal mode string the actions below branch on — kept as-is so that
  # logic only has to understand one string per slot instead of combining
  # a preset-source select with a brightness toggle at every check. See the
  # Daytime preset's two inputs above for what each half of the name means.
  day_brightness_mode: >-
    {{ ('slot_only' if day_own_brightness else 'override_slot') if day_preset_source == 'time_slot'
       else ('button_own' if day_own_brightness else 'button_slot') if day_preset_source == 'button'
       else ('keep_own' if day_own_brightness else 'override_current') }}
  day_brightness: "{{ (day_brightness_pct | float) * 255 / 100 }}"
  evening_brightness_pct: !input evening_brightness_pct
  evening_preset_source: !input evening_preset_source
  evening_own_brightness: !input evening_own_brightness
  evening_brightness_mode: >-
    {{ ('slot_only' if evening_own_brightness else 'override_slot') if evening_preset_source == 'time_slot'
       else ('button_own' if evening_own_brightness else 'button_slot') if evening_preset_source == 'button'
       else ('keep_own' if evening_own_brightness else 'override_current') }}
  evening_brightness: "{{ (evening_brightness_pct | float) * 255 / 100 }}"
  night_brightness_pct: !input night_brightness_pct
  night_preset_source: !input night_preset_source
  night_own_brightness: !input night_own_brightness
  night_brightness_mode: >-
    {{ ('slot_only' if night_own_brightness else 'override_slot') if night_preset_source == 'time_slot'
       else ('button_own' if night_own_brightness else 'button_slot') if night_preset_source == 'button'
       else ('keep_own' if night_own_brightness else 'override_current') }}
  night_brightness: "{{ (night_brightness_pct | float) * 255 / 100 }}"
  day_start_use_sunrise: !input day_start_use_sunrise
  day_start_apply_immediately: !input day_start_apply_immediately
  evening_start_use_sunset: !input evening_start_use_sunset
  dim_brightness_pct: !input dim_brightness_pct
  # The area selector yields a list, but an instance saved before this input
  # became multi-select still holds a bare string — accept both.
  room_list: "{{ [room] if room is string else room }}"
  # Single source of truth for what this automation controls: the override
  # when set, every light in the areas otherwise. Resolved at run time, so
  # moving a light between areas is picked up without editing anything.
  #
  # The derived branch drops light *groups* (an entity whose own state
  # carries an entity_id attribute listing members, e.g. a Hue room/zone
  # light or a light group helper — or a group_entities attribute, e.g. a
  # ZHA Zigbee group) so a group and its members aren't both snapshotted
  # and driven — snapshotting a member changes the group's state too, so
  # scene.turn_on would fight itself restoring both. An explicit override
  # is trusted as-is; if you deliberately listed a group, that's your call.
  light_entities: >-
    {% if (lights | count) > 0 -%}
    {{ lights }}
    {%- else -%}
    {%- set candidates = room_list | map('area_entities') | sum(start=[])
        | select('match', 'light\.') | list -%}
    {%- set ns = namespace(out=[]) -%}
    {%- for e in candidates -%}
      {%- if state_attr(e, 'entity_id') is none and state_attr(e, 'group_entities') is none -%}
        {%- set ns.out = ns.out + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.out }}
    {%- endif %}
  # One snapshot scene per instance, so several cannot overwrite each
  # other's memory.
  snapshot_scene_id: "presence_snapshot_{{ room_list | join('_') }}"
  snapshot_entity: "scene.presence_snapshot_{{ room_list | join('_') }}"
  # Deliberately the same formula the Hue Tap Dial and Hue Smart Button
  # blueprints use for this helper, so all three agree on its name without
  # any of them telling the others what they picked — see those
  # blueprints' "Room" input. The helper doesn't need to exist: a room
  # with no remote simply has nothing to restore here yet (see the
  # fallback's own read below).
  last_preset_helper: "input_text.{{ room_list | join('_') }}_laatste_preset"

triggers:
  # Motion and occupancy are two independent purpose-specific families, so a
  # room needs both trigger pairs to react to whichever class its sensor(s)
  # expose. Some devices report only one of the two (e.g. a plain PIR sensor
  # has no occupancy entity); others expose both from the same device, where
  # they can behave differently (a stuck/quirk-less motion cluster that never
  # clears vs. a reliably-timed occupancy cluster) — sharing the same trigger
  # id below means either firing drives the same branch, so the room still
  # works correctly even if one of the two classes is unreliable.
  - trigger: motion.detected
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  - trigger: occupancy.detected
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  - trigger: motion.cleared
    target:
      area_id: !input room
    options:
      for: !input no_motion_dim_after
      behavior: each
    id: no_motion
  - trigger: occupancy.cleared
    target:
      area_id: !input room
    options:
      for: !input no_motion_dim_after
      behavior: each
    id: no_motion
  # Shares the "motion" id so starting playback cancels a pending dim/off
  # countdown exactly like returning motion does (mode: restart) — fixes a
  # room going dark mid-film because nobody moved after pressing play.
  - trigger: media_player.started_playing
    target:
      area_id: !input room
    options:
      for: "00:00:00"
      behavior: each
    id: motion
  # The morning boundary, fixed time or sunrise depending on the toggle
  # above — `enabled:` takes a limited template over blueprint inputs, so
  # only the one matching the toggle ever actually attaches.
  - trigger: time
    at: !input day_start
    id: morning
    enabled: "{{ not day_start_use_sunrise }}"
  - trigger: sun
    event: sunrise
    id: morning
    enabled: "{{ day_start_use_sunrise }}"

conditions: []

actions:
  - choose:
      - alias: Someone is here
        conditions:
          - condition: trigger
            id: motion
        sequence:
          - choose:
              # Checked first, ahead of every memory branch below, so it
              # pre-empts all of them rather than being just another
              # fallback — that's the point of the toggle. Anchors the
              # night/evening time checks on their first use in the
              # document; the "Room is dark" branch further down reuses
              # them as plain aliases.
              - alias: Always apply the time-of-day preset, ignoring current state
                conditions:
                  - condition: template
                    value_template: "{{ force_preset_on_motion }}"
                sequence:
                  - choose:
                      - alias: Night
                        conditions:
                          - &is_night_now
                            condition: or
                            conditions:
                              - condition: time
                                after: !input night_start
                              - condition: time
                                before: !input day_start
                                enabled: "{{ not day_start_use_sunrise }}"
                              - condition: sun
                                before: sunrise
                                enabled: "{{ day_start_use_sunrise }}"
                        sequence:
                          - action: scene_presets.apply_preset
                            data:
                              preset_id: !input preset_night
                              brightness: >-
                                {{ omit if night_brightness_mode in ['slot_only', 'button_own', 'keep_own'] else night_brightness }}
                              targets:
                                entity_id: "{{ light_entities }}"
                      - alias: Evening
                        conditions:
                          - &is_evening_now
                            condition: or
                            conditions:
                              - condition: time
                                after: !input evening_start
                                enabled: "{{ not evening_start_use_sunset }}"
                              - condition: sun
                                after: sunset
                                enabled: "{{ evening_start_use_sunset }}"
                        sequence:
                          - action: scene_presets.apply_preset
                            data:
                              preset_id: !input preset_evening
                              brightness: >-
                                {{ omit if evening_brightness_mode in ['slot_only', 'button_own', 'keep_own'] else evening_brightness }}
                              targets:
                                entity_id: "{{ light_entities }}"
                    default:
                      - action: scene_presets.apply_preset
                        data:
                          preset_id: !input preset_day
                          brightness: >-
                            {{ omit if day_brightness_mode in ['slot_only', 'button_own', 'keep_own'] else day_brightness }}
                          targets:
                            entity_id: "{{ light_entities }}"
              - alias: We dimmed it, so put back exactly what was there
                conditions:
                  - condition: state
                    entity_id: !input dim_flag
                    state: "on"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ snapshot_entity }}"
                    data:
                      transition: !input transition
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input dim_flag
              # The controlled set is resolved at run time, so a native
              # light.is_on condition cannot address it — its target is
              # validated at load, before light_entities exists.
              - alias: Room is dark, so bring back its memory
                conditions:
                  - condition: template
                    value_template: >-
                      {{ expand(light_entities)
                         | selectattr('state', 'eq', 'on')
                         | list | count == 0 }}
                sequence:
                  - choose:
                      - alias: Night
                        conditions:
                          # Anchored above, in the "Always apply the
                          # time-of-day preset" branch (its first use in the
                          # document); reused here as a plain alias so the
                          # sunrise/sunset toggle can't drift out of sync
                          # between the two.
                          - *is_night_now
                        sequence:
                          - choose:
                              - alias: Time-of-day preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ night_brightness_mode in ['override_slot', 'slot_only'] }}
                                sequence:
                                  - action: scene_presets.apply_preset
                                    data:
                                      preset_id: !input preset_night
                                      brightness: >-
                                        {{ night_brightness if night_brightness_mode == 'override_slot' else omit }}
                                      targets:
                                        entity_id: "{{ light_entities }}"
                              - alias: Button preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ night_brightness_mode in ['button_own', 'button_slot'] }}
                                sequence:
                                  - choose:
                                      - alias: Last preset a remote applied
                                        conditions:
                                          - condition: template
                                            value_template: >-
                                              {{ states(last_preset_helper)
                                                 not in ['', 'unknown', 'unavailable'] }}
                                        sequence:
                                          - action: scene_presets.apply_preset
                                            data:
                                              preset_id: "{{ states(last_preset_helper) }}"
                                              brightness: >-
                                                {{ omit if night_brightness_mode == 'button_own' else night_brightness }}
                                              targets:
                                                entity_id: "{{ light_entities }}"
                                    default:
                                      - action: scene_presets.apply_preset
                                        data:
                                          preset_id: !input preset_night
                                          brightness: >-
                                            {{ omit if night_brightness_mode == 'button_own' else night_brightness }}
                                          targets:
                                            entity_id: "{{ light_entities }}"
                            default:
                              # Keep current light settings: restore the
                              # snapshot from the moment the room last went
                              # quiet, then — only for the slot-brightness
                              # variant — pin the brightness that leaves the
                              # room at, without changing what it's showing.
                              - choose:
                                  # The snapshot entity is per-room and
                                  # therefore dynamic, so a native state
                                  # condition cannot address it.
                                  - alias: Last known state
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(snapshot_entity)
                                             not in ['unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene.turn_on
                                        target:
                                          entity_id: "{{ snapshot_entity }}"
                                        data:
                                          transition: !input transition
                                      - if:
                                          - condition: template
                                            value_template: "{{ night_brightness_mode == 'override_current' }}"
                                        then:
                                          - action: light.turn_on
                                            target:
                                              entity_id: "{{ light_entities }}"
                                            data:
                                              brightness: "{{ night_brightness }}"
                                              transition: !input transition
                                default:
                                  - action: scene_presets.apply_preset
                                    data:
                                      preset_id: !input preset_night
                                      brightness: >-
                                        {{ omit if night_brightness_mode == 'keep_own' else night_brightness }}
                                      targets:
                                        entity_id: "{{ light_entities }}"
                      - alias: Evening
                        conditions:
                          - *is_evening_now
                        sequence:
                          - choose:
                              - alias: Time-of-day preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ evening_brightness_mode in ['override_slot', 'slot_only'] }}
                                sequence:
                                  - action: scene_presets.apply_preset
                                    data:
                                      preset_id: !input preset_evening
                                      brightness: >-
                                        {{ evening_brightness if evening_brightness_mode == 'override_slot' else omit }}
                                      targets:
                                        entity_id: "{{ light_entities }}"
                              - alias: Button preset
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ evening_brightness_mode in ['button_own', 'button_slot'] }}
                                sequence:
                                  - choose:
                                      - alias: Last preset a remote applied
                                        conditions:
                                          - condition: template
                                            value_template: >-
                                              {{ states(last_preset_helper)
                                                 not in ['', 'unknown', 'unavailable'] }}
                                        sequence:
                                          - action: scene_presets.apply_preset
                                            data:
                                              preset_id: "{{ states(last_preset_helper) }}"
                                              brightness: >-
                                                {{ omit if evening_brightness_mode == 'button_own' else evening_brightness }}
                                              targets:
                                                entity_id: "{{ light_entities }}"
                                    default:
                                      - action: scene_presets.apply_preset
                                        data:
                                          preset_id: !input preset_evening
                                          brightness: >-
                                            {{ omit if evening_brightness_mode == 'button_own' else evening_brightness }}
                                          targets:
                                            entity_id: "{{ light_entities }}"
                            default:
                              # Keep current light settings — see the Night
                              # slot above for why only the slot-brightness
                              # variant pins brightness afterward.
                              - choose:
                                  - alias: Last known state
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(snapshot_entity)
                                             not in ['unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene.turn_on
                                        target:
                                          entity_id: "{{ snapshot_entity }}"
                                        data:
                                          transition: !input transition
                                      - if:
                                          - condition: template
                                            value_template: "{{ evening_brightness_mode == 'override_current' }}"
                                        then:
                                          - action: light.turn_on
                                            target:
                                              entity_id: "{{ light_entities }}"
                                            data:
                                              brightness: "{{ evening_brightness }}"
                                              transition: !input transition
                                default:
                                  - action: scene_presets.apply_preset
                                    data:
                                      preset_id: !input preset_evening
                                      brightness: >-
                                        {{ omit if evening_brightness_mode == 'keep_own' else evening_brightness }}
                                      targets:
                                        entity_id: "{{ light_entities }}"
                    default:
                      # Daytime. Anchored so the "New day begins" branch
                      # further down can replay exactly this resolution when
                      # "Apply Daytime preset immediately each morning" is on.
                      - &daytime_dark_resolve
                        choose:
                          - alias: Time-of-day preset
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{ day_brightness_mode in ['override_slot', 'slot_only'] }}
                            sequence:
                              - action: scene_presets.apply_preset
                                data:
                                  preset_id: !input preset_day
                                  brightness: >-
                                    {{ day_brightness if day_brightness_mode == 'override_slot' else omit }}
                                  targets:
                                    entity_id: "{{ light_entities }}"
                          - alias: Button preset
                            conditions:
                              - condition: template
                                value_template: >-
                                  {{ day_brightness_mode in ['button_own', 'button_slot'] }}
                            sequence:
                              - choose:
                                  - alias: Last preset a remote applied
                                    conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ states(last_preset_helper)
                                             not in ['', 'unknown', 'unavailable'] }}
                                    sequence:
                                      - action: scene_presets.apply_preset
                                        data:
                                          preset_id: "{{ states(last_preset_helper) }}"
                                          brightness: >-
                                            {{ omit if day_brightness_mode == 'button_own' else day_brightness }}
                                          targets:
                                            entity_id: "{{ light_entities }}"
                                default:
                                  - action: scene_presets.apply_preset
                                    data:
                                      preset_id: !input preset_day
                                      brightness: >-
                                        {{ omit if day_brightness_mode == 'button_own' else day_brightness }}
                                      targets:
                                        entity_id: "{{ light_entities }}"
                        default:
                          # Keep current light settings — see the Night slot
                          # above for why only the slot-brightness variant
                          # pins brightness afterward.
                          - choose:
                              - alias: Last known state
                                conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ states(snapshot_entity)
                                         not in ['unknown', 'unavailable'] }}
                                sequence:
                                  - action: scene.turn_on
                                    target:
                                      entity_id: "{{ snapshot_entity }}"
                                    data:
                                      transition: !input transition
                                  - if:
                                      - condition: template
                                        value_template: "{{ day_brightness_mode == 'override_current' }}"
                                    then:
                                      - action: light.turn_on
                                        target:
                                          entity_id: "{{ light_entities }}"
                                        data:
                                          brightness: "{{ day_brightness }}"
                                          transition: !input transition
                            default:
                              - action: scene_presets.apply_preset
                                data:
                                  preset_id: !input preset_day
                                  brightness: >-
                                    {{ omit if day_brightness_mode == 'keep_own' else day_brightness }}
                                  targets:
                                    entity_id: "{{ light_entities }}"
            default:
              # Room already has a light on — not caught by the dim-flag or
              # dark-room branches above, and force_preset_on_motion is off
              # (that would have pre-empted this whole choose). A remote or
              # app may have just set a scene here on purpose, so the preset
              # itself is never touched. Brightness is a different matter:
              # only sync it, and only for "keep current light settings, at
              # the slot's brightness" ('override_current') — the same
              # condition the "Room is dark" branch above checks before
              # pinning brightness on a restored preset, just without
              # needing the room to have gone fully dark first. Every other
              # combination is left alone here; forcing one onto an
              # already-lit room is what force_preset_on_motion is for.
              - choose:
                  - alias: Night
                    conditions:
                      - *is_night_now
                    sequence:
                      - condition: template
                        value_template: "{{ night_brightness_mode == 'override_current' }}"
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light_entities }}"
                        data:
                          brightness: "{{ night_brightness }}"
                          transition: !input transition
                  - alias: Evening
                    conditions:
                      - *is_evening_now
                    sequence:
                      - condition: template
                        value_template: "{{ evening_brightness_mode == 'override_current' }}"
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light_entities }}"
                        data:
                          brightness: "{{ evening_brightness }}"
                          transition: !input transition
                default:
                  # Daytime
                  - condition: template
                    value_template: "{{ day_brightness_mode == 'override_current' }}"
                  - action: light.turn_on
                    target:
                      entity_id: "{{ light_entities }}"
                    data:
                      brightness: "{{ day_brightness }}"
                      transition: !input transition
      - alias: Room has gone quiet
        conditions:
          - condition: trigger
            id: no_motion
        sequence:
          - alias: Nothing to dim if the room is already dark
            condition: template
            value_template: >-
              {{ expand(light_entities)
                 | selectattr('state', 'eq', 'on')
                 | list | count > 0 }}
          - condition: not
            conditions:
              - condition: media_player.is_playing
                target:
                  area_id: !input room
                options:
                  for: "00:00:00"
                  behavior: any
          - alias: Remember exactly how the light stands now
            action: scene.create
            data:
              scene_id: "{{ snapshot_scene_id }}"
              snapshot_entities: "{{ light_entities }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input dim_flag
          # brightness_step_pct is relative to each light's own current
          # brightness, not an absolute target — so a light already dim only
          # drops a little further instead of being pushed up to a fixed
          # level. That makes "never brighten" automatic, with no threshold
          # check needed. Off lights are excluded; a step has nothing to
          # step from and should not switch them on.
          - alias: Dim as a warning
            action: light.turn_on
            target:
              entity_id: >-
                {{ expand(light_entities)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id') | list }}
            data:
              brightness_step_pct: "{{ -1 * (dim_brightness_pct | float) }}"
              transition: !input transition
          # Returning motion restarts the automation and cancels this wait.
          - delay: !input no_motion_off_after
          - alias: Still quiet, so switch off
            action: light.turn_off
            target:
              entity_id: "{{ light_entities }}"
            data:
              transition: !input transition
          - action: input_boolean.turn_off
            target:
              entity_id: !input dim_flag
      - alias: New day begins
        conditions:
          - condition: trigger
            id: morning
        sequence:
          - choose:
              - alias: Forget the button preset
                conditions:
                  # Same 'unknown' reading as everywhere else in this
                  # blueprint: a room with no remote has no such helper, so
                  # there's nothing to clear.
                  - condition: template
                    value_template: "{{ states(last_preset_helper) != 'unknown' }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ last_preset_helper }}"
                    data:
                      value: ""
          - if:
              - condition: template
                value_template: "{{ day_start_apply_immediately }}"
            then:
              # Replays the exact same resolution a motion event would use
              # for the Daytime slot — reused via anchor so the two can
              # never drift apart.
              - *daytime_dark_resolve
